<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MAYDIN STORE</title>
    <script>
      if (!localStorage.getItem('token')) {
        sessionStorage.setItem('loginNotice', '이 약국몰은 회원 전용이에요. 로그인하거나 영수증 코드로 가입해 주세요.');
        location.replace('/login.html' + location.search);
      }
    </script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="/mall.css" />
    <style>
      * {
        box-sizing: border-box;
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background: #fff;
        color: #191f28;
        padding-bottom: 120px;
      }

      header {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .header-inner {
        align-items: center;
        display: flex;
        gap: 12px;
        margin: 0 auto;
        max-width: 768px;
        padding: 12px 20px;
      }

      .back {
        color: #191f28;
        font-size: 22px;
        font-weight: 700;
        text-decoration: none;
      }

      .header-inner .mall-brand {
        flex: 1;
      }

      .icon-btn {
        display: flex;
        position: relative;
      }

      .icon-btn svg {
        height: 24px;
        stroke: #191f28;
        width: 24px;
      }

      .cart-badge {
        align-items: center;
        background: #f04452;
        border-radius: 50%;
        color: #fff;
        display: flex;
        font-size: 11px;
        font-weight: 800;
        height: 16px;
        justify-content: center;
        min-width: 16px;
        padding: 0 4px;
        position: absolute;
        right: -7px;
        top: -5px;
      }

      .cart-badge[hidden] {
        display: none;
      }

      main {
        margin: 0 auto;
        max-width: 768px;
      }

      .hero-img {
        align-items: center;
        aspect-ratio: 1 / 1;
        background: #f2f4f6;
        display: flex;
        justify-content: center;
        overflow: hidden;
        width: 100%;
      }

      @media (min-width: 640px) {
        .hero-img {
          border-radius: 24px;
          margin: 16px auto 0;
          width: calc(100% - 40px);
        }
      }

      .hero-img img {
        height: 100%;
        object-fit: cover;
        width: 100%;
      }

      .hero-img .placeholder {
        color: #8b95a1;
        font-size: 15px;
        font-weight: 800;
      }

      .gallery {
        position: relative;
      }

      .gallery-track {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }

      .gallery-track::-webkit-scrollbar {
        display: none;
      }

      .gallery-track > .hero-img {
        border-radius: 0;
        flex: 0 0 100%;
        margin: 0;
        scroll-snap-align: center;
        width: 100%;
      }

      @media (min-width: 640px) {
        .gallery-track {
          border-radius: 24px;
          margin: 16px 20px 0;
        }
      }

      .gallery-dots {
        bottom: 14px;
        display: flex;
        gap: 6px;
        justify-content: center;
        left: 0;
        position: absolute;
        right: 0;
      }

      .gallery-dots button {
        background: rgba(255, 255, 255, 0.6);
        border: none;
        border-radius: 50%;
        cursor: pointer;
        height: 7px;
        padding: 0;
        width: 7px;
      }

      .gallery-dots button.on {
        background: #191f28;
      }

      .gallery-count {
        background: rgba(25, 31, 40, 0.6);
        border-radius: 999px;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 9px;
        position: absolute;
        right: 14px;
        top: 14px;
      }

      .detail.mfds dl {
        display: grid;
        font-size: 14px;
        gap: 12px;
      }

      .detail.mfds dt {
        color: #8b95a1;
        font-size: 13px;
        font-weight: 800;
      }

      .detail.mfds dd {
        color: #333d4b;
        line-height: 1.65;
        margin: 2px 0 0;
        white-space: pre-wrap;
        word-break: keep-all;
      }

      .ingredient-list {
        display: grid;
        gap: 10px;
        list-style: none;
        margin: 0 0 18px;
        padding: 0;
      }

      .ingredient-list li {
        background: #f7f8fa;
        border-radius: 14px;
        display: grid;
        gap: 4px;
        padding: 12px 14px;
      }

      .ingredient-list strong {
        color: #1b64da;
        font-size: 14px;
        font-weight: 800;
      }

      .ingredient-list span {
        color: #333d4b;
        font-size: 14px;
        line-height: 1.6;
        word-break: keep-all;
      }

      .detail.mfds h3 {
        font-size: 14px;
        font-weight: 800;
        margin: 4px 0 10px;
      }

      .detail.mfds .contents dl,
      .detail.mfds .safety dl {
        gap: 8px 12px;
        grid-template-columns: minmax(96px, 38%) 1fr;
      }

      .detail.mfds .contents dt,
      .detail.mfds .safety dt {
        color: #333d4b;
        font-size: 13px;
        font-weight: 700;
      }

      .detail.mfds .contents dd,
      .detail.mfds .safety dd {
        margin: 0;
      }

      .detail.mfds .safety {
        margin-top: 14px;
      }

      .detail.mfds .safety summary {
        color: #4e5968;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .detail.mfds .source {
        color: #8b95a1;
        font-size: 12px;
        line-height: 1.6;
        margin-top: 16px;
      }

      .summary {
        padding: 22px 20px 20px;
      }

      .crumb {
        color: #8b95a1;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
      }

      h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.4px;
        line-height: 1.35;
      }

      .price-wrap {
        align-items: baseline;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        margin-top: 14px;
      }

      .discount {
        color: #f04452;
        font-size: 22px;
        font-weight: 800;
      }

      .price {
        font-size: 24px;
        font-weight: 900;
      }

      .list-price {
        color: #8b95a1;
        font-size: 15px;
        text-decoration: line-through;
      }

      .stock {
        border-radius: 8px;
        display: inline-block;
        font-size: 12px;
        font-weight: 800;
        margin-top: 12px;
        padding: 5px 9px;
      }

      .stock.ok {
        background: #e8f3ff;
        color: #1b64da;
      }

      .stock.out {
        background: #fdecee;
        color: #f04452;
      }

      .info {
        border-top: 10px solid #f2f4f6;
        padding: 18px 20px;
      }

      .info dl {
        display: grid;
        font-size: 14px;
        gap: 10px 14px;
        grid-template-columns: 72px 1fr;
      }

      .info dt {
        color: #8b95a1;
        font-weight: 700;
      }

      .info dd {
        color: #333d4b;
        line-height: 1.5;
        margin: 0;
      }

      .detail {
        border-top: 10px solid #f2f4f6;
        padding: 22px 20px;
      }

      .detail h2 {
        font-size: 17px;
        font-weight: 800;
        margin-bottom: 12px;
      }

      .detail p {
        color: #333d4b;
        font-size: 15px;
        line-height: 1.75;
        white-space: pre-wrap;
        word-break: keep-all;
      }

      .detail .muted {
        color: #8b95a1;
      }

      .buy-bar {
        background: #fff;
        border-top: 1px solid #f2f4f6;
        bottom: 0;
        left: 0;
        padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
        position: fixed;
        right: 0;
        z-index: 20;
      }

      .buy-inner {
        align-items: center;
        display: flex;
        gap: 10px;
        margin: 0 auto;
        max-width: 728px;
      }

      .qty {
        align-items: center;
        border: 1px solid #e5e8eb;
        border-radius: 14px;
        display: flex;
        flex-shrink: 0;
        height: 52px;
      }

      .qty button {
        background: none;
        border: none;
        color: #333d4b;
        cursor: pointer;
        font-size: 20px;
        font-weight: 700;
        height: 100%;
        width: 40px;
      }

      .qty span {
        font-size: 16px;
        font-weight: 800;
        min-width: 26px;
        text-align: center;
      }

      .buy-btn {
        border: none;
        border-radius: 14px;
        cursor: pointer;
        flex: 1;
        font-size: 16px;
        font-weight: 800;
        height: 52px;
      }

      .buy-btn.secondary {
        background: #e8f3ff;
        color: #1b64da;
      }

      .buy-btn.primary {
        background: #3182f6;
        color: #fff;
      }

      .buy-btn.muted {
        background: #f2f4f6;
        color: #4e5968;
      }

      .state {
        color: #4e5968;
        font-size: 15px;
        line-height: 1.6;
        padding: 80px 24px;
        text-align: center;
      }

      .state a {
        color: #3182f6;
        font-weight: 800;
      }

      .toast {
        background: rgba(25, 31, 40, 0.94);
        border-radius: 999px;
        bottom: 100px;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        left: 50%;
        opacity: 0;
        padding: 12px 18px;
        pointer-events: none;
        position: fixed;
        transform: translate(-50%, 10px);
        transition: 0.2s;
        white-space: nowrap;
        z-index: 30;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a class="back" id="backLink" href="/store.html" aria-label="몰 홈으로">←</a>
        <a class="mall-brand" id="brandLink" href="/store.html">
          <span class="mall-brand-title">MAYDIN STORE</span>
          <span class="mall-brand-sub" id="mallSub">약국 온라인 몰</span>
        </a>
        <a class="icon-btn" id="cartLink" href="/cart.html" aria-label="장바구니">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge" id="cartBadge" hidden>0</span>
        </a>
      </div>
    </header>

    <main id="page"><p class="state">상품 정보를 불러오는 중이에요.</p></main>

    <div class="buy-bar" id="buyBar" hidden>
      <div class="buy-inner" id="buyInner"></div>
    </div>

    <div id="message" class="toast"></div>

    <script src="/app.js"></script>
    <script>
      const pharmacyCode = pharmacyCodeFromUrl();
      const productId = Number(new URLSearchParams(location.search).get('id'));
      const storeUrl = withPharmacy('/store.html', pharmacyCode);
      let pharmacy = null;
      let mall = null;
      let product = null;
      let images = [];
      let mfds = null;
      let quantity = 1;
      let alertId = null;

      $('#backLink').href = storeUrl;
      $('#brandLink').href = storeUrl;
      $('#cartLink').href = withPharmacy('/cart.html', pharmacyCode);

      function toast(text) {
        const target = $('#message');
        target.textContent = text;
        target.classList.add('show');
        window.clearTimeout(window.__toastTimer);
        window.__toastTimer = window.setTimeout(() => target.classList.remove('show'), 2200);
      }

      const salePrice = (p) => Number(p.discount_price || p.price || 0);
      const isSoldOut = (p) => p.status === 'SOLD_OUT' || Number(p.stock_quantity) <= 0;
      const maxQuantity = () => Math.max(1, Math.min(99, Number(product.stock_quantity) || 1));

      function isCustomerInThisStore() {
        const user = currentUser();
        return user?.role === 'CUSTOMER' && pharmacy && Number(user.pharmacy_id) === Number(pharmacy.id);
      }

      function discountRate(p) {
        if (!p.discount_price || Number(p.discount_price) >= Number(p.price)) return null;
        return Math.round((1 - Number(p.discount_price) / Number(p.price)) * 100);
      }

      function showState(text) {
        $('#page').replaceChildren(el('p', { class: 'state' }, text, el('br'), el('a', { href: storeUrl }, '몰 홈으로')));
        $('#buyBar').hidden = true;
      }

      // 약국이 올린 사진(여러 장)을 옆으로 넘겨 본다. 사진이 없으면 약국이 넣은 이미지 주소, 그것도 없으면 이름 칸.
      function heroImage() {
        const placeholder = () => el('span', { class: 'placeholder' }, product.brand || product.category_name || '상품 이미지');
        const urls = images.length ? images.map((img) => img.url) : [safeUrl(product.thumbnail_url)].filter(Boolean);
        if (!urls.length) return el('div', { class: 'hero-img' }, placeholder());
        const track = el(
          'div',
          { class: 'gallery-track', onscroll: (e) => markSlide(Math.round(e.currentTarget.scrollLeft / e.currentTarget.clientWidth)) },
          ...urls.map((src, index) =>
            el('div', { class: 'hero-img' }, el('img', { src, alt: `${product.product_name} 사진 ${index + 1}`, loading: index ? 'lazy' : 'eager', referrerpolicy: 'no-referrer', onerror: (e) => e.currentTarget.replaceWith(placeholder()) }))
          )
        );
        if (urls.length === 1) return track;
        const dots = el('div', { class: 'gallery-dots' }, ...urls.map((_, index) => el('button', { type: 'button', 'aria-label': `사진 ${index + 1}`, class: index ? '' : 'on', onclick: () => track.scrollTo({ left: index * track.clientWidth, behavior: 'smooth' }) })));
        return el('div', { class: 'gallery' }, track, dots, el('span', { class: 'gallery-count', id: 'galleryCount' }, `1 / ${urls.length}`));
      }

      function markSlide(index) {
        document.querySelectorAll('.gallery-dots button').forEach((dot, i) => dot.classList.toggle('on', i === index));
        const count = $('#galleryCount');
        if (count) count.textContent = `${index + 1} / ${document.querySelectorAll('.gallery-dots button').length}`;
      }

      // "[EPA 및 DHA 함유유지] 혈중 중성지질 개선…" → 원료별 기능성. 괄호가 없으면 통째로 한 줄.
      function functionalIngredients(text) {
        const parts = String(text || '')
          .split(/(?=\[[^\]]+\])/)
          .map((part) => part.trim())
          .filter(Boolean);
        return parts.map((part) => {
          const match = part.match(/^\[([^\]]+)\]\s*([\s\S]*)$/);
          return match ? { name: match[1].trim(), effect: match[2].trim() } : { name: null, effect: part };
        });
      }

      // 기준 및 규격에서 성분 함량 줄과 안전 기준(성상·중금속·미생물·붕해 등) 줄을 나눈다. 글자는 신고된 그대로 둔다.
      const SAFETY_ITEMS = /성상|납|카드뮴|수은|비소|대장균|세균|살모넬라|황색포도상구균|붕해|붕괴|이물|수분|산가|과산화물|아플라톡신|잔류|용매|에탄올|메탄올|벤조피렌|크기|사용기준/;
      function standardLines(text) {
        const lines = String(text || '')
          .split(/\n|(?=\s\(?\d{1,2}[.)]\s)/)
          .map((line) => line.replace(/^\s*\(?\d{1,2}[.)]\s*/, '').trim())
          .filter(Boolean);
        const rows = lines.map((line) => {
          const index = line.indexOf(':');
          return index > 0 ? { name: line.slice(0, index).trim(), value: line.slice(index + 1).trim() } : { name: line, value: '' };
        });
        return {
          contents: rows.filter((row) => !SAFETY_ITEMS.test(row.name)),
          safety: rows.filter((row) => SAFETY_ITEMS.test(row.name))
        };
      }

      // 식약처 건강기능식품 신고 내용. 고친 문구 없이 신고된 그대로 보여 준다.
      function mfdsSection() {
        if (!mfds) return null;
        const functional = functionalIngredients(mfds.main_function);
        const { contents, safety } = standardLines(mfds.standard);
        const ingredients = el(
          'section',
          { class: 'detail mfds' },
          el('h2', {}, '성분 · 기능성'),
          functional.length
            ? el(
                'ul',
                { class: 'ingredient-list' },
                ...functional.map((item) => el('li', {}, item.name ? el('strong', {}, item.name) : null, el('span', {}, item.effect)))
              )
            : null,
          contents.length
            ? el(
                'div',
                { class: 'contents' },
                el('h3', {}, '성분 함량 (표시량 기준)'),
                el('dl', {}, ...contents.flatMap((row) => [el('dt', {}, row.name), el('dd', {}, row.value || '-')]))
              )
            : null,
          safety.length
            ? el(
                'details',
                { class: 'safety' },
                el('summary', {}, `안전 기준 ${safety.length}개 (성상·중금속·미생물 등)`),
                el('dl', {}, ...safety.flatMap((row) => [el('dt', {}, row.name), el('dd', {}, row.value || '-')]))
              )
            : null
        );
        const rows = [
          ['섭취 방법', mfds.intake_method],
          ['섭취 시 주의사항', mfds.intake_caution],
          ['보관 방법', mfds.storage],
          ['소비기한', mfds.shelf_life]
        ].filter(([, value]) => value);
        const updated = String(mfds.fetched_at || '').slice(0, 10);
        const usage = el(
          'section',
          { class: 'detail mfds' },
          el('h2', {}, '섭취 방법 · 주의사항'),
          el('dl', {}, ...rows.flatMap(([label, value]) => [el('dt', {}, label), el('dd', {}, value)])),
          el(
            'p',
            { class: 'source' },
            `${mfds.product_name}${mfds.company ? ` · ${mfds.company}` : ''} · 신고번호 ${mfds.report_no}`,
            el('br'),
            `출처: ${mfds.source}${updated ? ` (${updated} 기준)` : ''}. 실제 제품 포장의 표시 사항을 우선해 주세요.`
          )
        );
        return { ingredients, usage };
      }

      function deliveryLine() {
        if (!mall.delivery_enabled) return '배송 주문을 받지 않아요';
        const fee = deliveryFeeOf(mall, salePrice(product) * quantity);
        return `${fee ? `배송비 ${money(fee)}` : '무료배송'}${mall.delivery_fee && mall.free_delivery_min ? ` (${money(mall.free_delivery_min)} 이상 무료)` : ''}`;
      }

      function renderPage() {
        const mfdsParts = mfdsSection();
        const rate = discountRate(product);
        const soldOut = isSoldOut(product);
        const rows = [
          ['배송', deliveryLine()],
          mall.pickup_enabled ? ['매장 픽업', `${pharmacy.pharmacy_name}에서 무료로 받을 수 있어요`] : null,
          product.supply_days ? ['사용 기간', `1개 기준 약 ${product.supply_days}일분`] : null,
          ['판매', pharmacy.pharmacy_name]
        ].filter(Boolean);
        $('#page').replaceChildren(...[
          heroImage(),
          el(
            'section',
            { class: 'summary' },
            el('div', { class: 'crumb' }, [product.category_name, product.brand].filter(Boolean).join(' · ') || ' '),
            el('h1', {}, product.product_name),
            el(
              'div',
              { class: 'price-wrap' },
              rate ? el('span', { class: 'discount' }, `${rate}%`) : null,
              el('span', { class: 'price' }, money(salePrice(product))),
              rate ? el('span', { class: 'list-price' }, money(product.price)) : null
            ),
            el('span', { class: soldOut ? 'stock out' : 'stock ok' }, soldOut ? '품절' : '구매 가능')
          ),
          el('section', { class: 'info' }, el('dl', {}, ...rows.flatMap(([label, value]) => [el('dt', {}, label), el('dd', label === '배송' ? { id: 'deliveryLine' } : {}, value)]))),
          mfdsParts?.ingredients,
          product.description || !mfdsParts
            ? el(
                'section',
                { class: 'detail' },
                el('h2', {}, '약국 설명'),
                product.description ? el('p', {}, product.description) : el('p', { class: 'muted' }, '성분 정보가 아직 등록되지 않았어요. 궁금한 점은 약국에 문의해 주세요.')
              )
            : null,
          mfdsParts?.usage,
          sellerFooter(window.__seller)
        ].filter(Boolean));
        renderBuyBar();
      }

      function renderBuyBar() {
        $('#buyBar').hidden = false;
        if (isSoldOut(product)) {
          $('#buyInner').replaceChildren(
            el('button', { type: 'button', class: alertId ? 'buy-btn muted' : 'buy-btn secondary', onclick: toggleAlert }, alertId ? '입고 알림 신청됨 · 취소' : '입고 알림 받기')
          );
          return;
        }
        $('#buyInner').replaceChildren(
          el(
            'div',
            { class: 'qty' },
            el('button', { type: 'button', 'aria-label': '수량 줄이기', onclick: () => setQuantity(quantity - 1) }, '−'),
            el('span', { id: 'qtyValue' }, String(quantity)),
            el('button', { type: 'button', 'aria-label': '수량 늘리기', onclick: () => setQuantity(quantity + 1) }, '+')
          ),
          el('button', { type: 'button', class: 'buy-btn secondary', onclick: () => addToCart(false) }, '장바구니'),
          el('button', { type: 'button', class: 'buy-btn primary', onclick: () => addToCart(true) }, `${money(salePrice(product) * quantity)} 구매`)
        );
      }

      function setQuantity(next) {
        const limited = Math.max(1, Math.min(maxQuantity(), next));
        if (next > maxQuantity()) toast(`지금 주문할 수 있는 수량은 ${maxQuantity()}개까지예요.`);
        quantity = limited;
        $('#deliveryLine').textContent = deliveryLine();
        renderBuyBar();
      }

      async function refreshCartBadge() {
        if (!isCustomerInThisStore()) return;
        const data = await api.request('/cart');
        const count = data.items.reduce((sum, item) => sum + Number(item.quantity), 0);
        $('#cartBadge').textContent = count > 99 ? '99+' : String(count);
        $('#cartBadge').hidden = count === 0;
      }

      async function addToCart(goToCart) {
        if (!isCustomerInThisStore()) return toast('약국 계정으로 미리 보는 중에는 담을 수 없어요.');
        try {
          await api.request('/cart', { method: 'POST', body: { product_id: product.id, quantity } });
          if (goToCart) return location.assign(withPharmacy('/cart.html', pharmacyCode));
          toast('장바구니에 담았어요.');
          await refreshCartBadge();
        } catch (error) {
          toast(error.message);
        }
      }

      async function loadAlert() {
        if (!isCustomerInThisStore() || !isSoldOut(product)) return;
        try {
          const { alerts } = await api.request('/demand/me/restock-alerts');
          alertId = alerts.find((a) => a.status === 'WAITING' && a.product_id === product.id)?.id || null;
        } catch {
          alertId = null;
        }
      }

      async function toggleAlert() {
        if (!isCustomerInThisStore()) return toast('입고 알림은 이 약국몰 회원만 신청할 수 있어요.');
        try {
          if (alertId) {
            await api.request(`/demand/me/restock-alerts/${alertId}`, { method: 'DELETE' });
            toast('입고 알림을 취소했어요.');
          } else {
            await api.request('/demand/me/restock-alerts', { method: 'POST', body: { product_id: product.id } });
            toast('입고되면 알려 드릴게요.');
          }
          await loadAlert();
          renderBuyBar();
        } catch (error) {
          toast(error.message);
        }
      }

      async function load() {
        if (!Number.isInteger(productId) || productId <= 0) return showState('상품을 찾을 수 없어요.');
        try {
          const data = await api.request(`/pharmacies/by-code/${encodeURIComponent(pharmacyCode)}`);
          pharmacy = data.pharmacy;
          mall = data.mall;
          window.__seller = data.seller;
          $('#mallSub').textContent = mallSubtitle(pharmacy);
          const result = await api.request(`/products/mall/${productId}?pharmacyCode=${encodeURIComponent(pharmacyCode)}`);
          product = result.product;
          images = result.images || [];
          mfds = result.mfds || null;
          document.title = mallTitle(pharmacy, product.product_name);
          if (result.online_paused && result.notice) toast(result.notice);
          await loadAlert();
          renderPage();
          refreshCartBadge().catch(() => {});
        } catch (error) {
          if (handleMallAuthError(error, pharmacyCode)) return;
          showState(error.status === 404 ? '판매하지 않거나 없는 상품이에요.' : error.message);
        }
      }

      if (requireMallLogin(pharmacyCode)) load();
    </script>
  </body>
</html>
