<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MAYDIN STORE</title>
    <script>
      if (!localStorage.getItem('token')) {
        sessionStorage.setItem('loginNotice', '이 약국몰은 회원 전용이에요. 로그인하거나 영수증 코드로 가입해 주세요.');
        location.replace('/login.html' + location.search);
      }
    </script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="/mall.css" />
    <style>
      :root {
        --toss-blue: #3182f6;
        --toss-blue-light: #e8f3ff;
        --bg-main: #fff;
        --bg-sub: #f2f4f6;
        --text-main: #191f28;
        --text-sub: #4e5968;
        --text-muted: #8b95a1;
        --border: #f2f4f6;
        --danger: #f04452;
      }

      * {
        box-sizing: border-box;
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background: var(--bg-main);
        color: var(--text-main);
        padding-bottom: 110px;
      }

      a {
        color: inherit;
      }

      header {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        background: rgba(255, 255, 255, 0.9);
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header-inner {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin: 0 auto;
        max-width: 768px;
        padding: 12px 20px;
      }

      .header-actions {
        align-items: center;
        display: flex;
        flex-shrink: 0;
        gap: 16px;
      }

      .icon-btn {
        align-items: center;
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        display: flex;
        position: relative;
        text-decoration: none;
      }

      .icon-btn svg {
        height: 24px;
        stroke: var(--text-main);
        width: 24px;
      }

      .cart-badge {
        align-items: center;
        background: var(--danger);
        border-radius: 50%;
        color: #fff;
        display: flex;
        font-size: 11px;
        font-weight: 800;
        height: 16px;
        justify-content: center;
        min-width: 16px;
        padding: 0 4px;
        position: absolute;
        right: -7px;
        top: -5px;
      }

      .cart-badge[hidden] {
        display: none;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 32px;
        margin: 0 auto;
        max-width: 768px;
      }

      .mall-notice {
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
        margin: 12px 20px 0;
        padding: 12px 14px;
      }

      .mall-notice.warn {
        background: #fff4e5;
        color: #9a5b00;
      }

      .store-card {
        background: var(--bg-sub);
        border-radius: 22px;
        margin: 16px 20px 0;
        padding: 20px;
      }

      .store-label {
        color: var(--toss-blue);
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 4px;
      }

      .store-card h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.4px;
      }

      .store-card .owner-notice {
        background: #fff;
        border-radius: 14px;
        color: var(--text-main);
        font-size: 14px;
        line-height: 1.6;
        margin-top: 12px;
        padding: 12px 14px;
        white-space: pre-wrap;
      }

      .store-info {
        color: var(--text-sub);
        display: grid;
        font-size: 13px;
        gap: 6px;
        margin-top: 14px;
      }

      .store-info div {
        display: flex;
        gap: 8px;
      }

      .store-info dt {
        color: var(--text-muted);
        flex-shrink: 0;
        font-weight: 700;
        width: 44px;
      }

      .store-info dd {
        margin: 0;
      }

      .store-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      .ghost-btn {
        background: #fff;
        border: 1px solid #e5e8eb;
        border-radius: 12px;
        color: var(--text-main);
        font-size: 13px;
        font-weight: 800;
        padding: 10px 14px;
        text-decoration: none;
      }

      .search-section {
        padding: 0 20px;
      }

      .search-box {
        align-items: center;
        background: var(--bg-sub);
        border-radius: 16px;
        display: flex;
        gap: 10px;
        padding: 0 16px;
      }

      .search-box svg {
        flex-shrink: 0;
        height: 18px;
        stroke: var(--text-muted);
        width: 18px;
      }

      .search-box input {
        background: transparent;
        border: none;
        flex: 1;
        font-size: 15px;
        outline: none;
        padding: 14px 0;
      }

      .category-scroll {
        margin-top: -16px;
        overflow-x: auto;
        padding: 0 20px;
        scrollbar-width: none;
        white-space: nowrap;
      }

      .category-scroll::-webkit-scrollbar,
      .horizontal-products::-webkit-scrollbar {
        display: none;
      }

      .chip-list {
        display: flex;
        gap: 8px;
      }

      .chip {
        background: var(--bg-sub);
        border: none;
        border-radius: 100px;
        color: var(--text-sub);
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        padding: 10px 16px;
      }

      .chip small {
        font-size: 12px;
        margin-left: 4px;
        opacity: 0.7;
      }

      .chip.active {
        background: var(--text-main);
        color: #fff;
      }

      .section-header {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 14px;
        padding: 0 20px;
      }

      .section-header h2 {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.4px;
      }

      .section-header h2 small {
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 700;
        margin-left: 6px;
      }

      .section-header select {
        background: var(--bg-sub);
        border: none;
        border-radius: 10px;
        color: var(--text-sub);
        font-size: 13px;
        font-weight: 700;
        padding: 8px 10px;
      }

      .horizontal-products {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        padding: 0 20px 4px;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }

      .h-card {
        flex: 0 0 148px;
        scroll-snap-align: start;
        text-decoration: none;
      }

      .img-box {
        align-items: center;
        aspect-ratio: 1 / 1;
        background: var(--bg-sub);
        border-radius: 18px;
        display: flex;
        justify-content: center;
        margin-bottom: 10px;
        overflow: hidden;
        position: relative;
        width: 100%;
      }

      .img-box img {
        height: 100%;
        object-fit: cover;
        width: 100%;
      }

      .placeholder {
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
      }

      .rank-badge {
        align-items: center;
        background: rgba(0, 0, 0, 0.72);
        border-radius: 8px;
        color: #fff;
        display: flex;
        font-size: 12px;
        font-weight: 800;
        height: 24px;
        justify-content: center;
        left: 10px;
        position: absolute;
        top: 10px;
        width: 24px;
      }

      .badge-wrap {
        bottom: 10px;
        display: flex;
        gap: 4px;
        left: 10px;
        position: absolute;
      }

      .tag {
        background: rgba(255, 255, 255, 0.94);
        border-radius: 6px;
        font-size: 11px;
        font-weight: 800;
        padding: 4px 7px;
      }

      .tag.blue {
        color: var(--toss-blue);
      }

      .tag.red {
        color: var(--danger);
      }

      .tag.dark {
        background: rgba(25, 31, 40, 0.86);
        color: #fff;
      }

      .card-brand {
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 2px;
      }

      .card-name {
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        display: -webkit-box;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.4;
        margin-bottom: 6px;
        overflow: hidden;
      }

      .price-wrap {
        align-items: baseline;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 6px;
      }

      .discount {
        color: var(--danger);
        font-size: 16px;
        font-weight: 800;
      }

      .price {
        font-size: 16px;
        font-weight: 800;
      }

      .list-price {
        color: var(--text-muted);
        font-size: 13px;
        text-decoration: line-through;
      }

      .product-grid {
        display: grid;
        gap: 24px 14px;
        grid-template-columns: repeat(2, 1fr);
        padding: 0 20px;
      }

      @media (min-width: 640px) {
        .product-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .v-card {
        display: flex;
        flex-direction: column;
      }

      .v-card > a {
        text-decoration: none;
      }

      .v-card .img-box {
        transition: transform 0.15s;
      }

      .v-card > a:active .img-box {
        transform: scale(0.98);
      }

      .add-btn {
        background: var(--text-main);
        border: none;
        border-radius: 12px;
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
        margin-top: 10px;
        padding: 11px 12px;
      }

      .add-btn.alert-btn {
        background: var(--toss-blue-light);
        color: var(--toss-blue);
      }

      .add-btn.alert-btn.on {
        background: var(--bg-sub);
        color: var(--text-sub);
      }

      .empty {
        background: var(--bg-sub);
        border-radius: 18px;
        color: var(--text-sub);
        font-size: 14px;
        grid-column: 1 / -1;
        line-height: 1.6;
        padding: 28px 20px;
        text-align: center;
      }

      .request-box {
        background: var(--bg-sub);
        border-radius: 18px;
        grid-column: 1 / -1;
        padding: 20px;
      }

      .request-box h4 {
        font-size: 16px;
        margin-bottom: 6px;
      }

      .request-box input {
        background: #fff;
        border: 1px solid #e5e8eb;
        border-radius: 12px;
        font-size: 14px;
        margin-top: 8px;
        padding: 12px;
        width: 100%;
      }

      .muted {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .bottom-nav {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(25, 31, 40, 0.92);
        border-radius: 100px;
        bottom: 20px;
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.2);
        display: flex;
        gap: 40px;
        left: 50%;
        padding: 12px 32px;
        position: fixed;
        transform: translateX(-50%);
        z-index: 100;
      }

      .nav-item {
        align-items: center;
        color: rgba(255, 255, 255, 0.55);
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-decoration: none;
      }

      .nav-item.active {
        color: #fff;
      }

      .nav-item svg {
        fill: none;
        height: 24px;
        stroke: currentColor;
        stroke-width: 2;
        width: 24px;
      }

      .nav-item span {
        font-size: 11px;
        font-weight: 700;
      }

      .toast {
        background: rgba(25, 31, 40, 0.94);
        border-radius: 999px;
        bottom: 96px;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        left: 50%;
        opacity: 0;
        padding: 12px 18px;
        pointer-events: none;
        position: fixed;
        transform: translate(-50%, 10px);
        transition: 0.2s;
        white-space: nowrap;
        z-index: 200;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 420px) {
        .header-inner,
        .section-header,
        .category-scroll,
        .horizontal-products,
        .product-grid,
        .search-section {
          padding-left: 16px;
          padding-right: 16px;
        }

        .store-card,
        .mall-notice {
          margin-left: 16px;
          margin-right: 16px;
        }

        .product-grid {
          gap: 22px 12px;
        }

        .bottom-nav {
          bottom: 14px;
          gap: 32px;
          padding: 11px 28px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a class="mall-brand" id="brandLink" href="#">
          <span class="mall-brand-title">MAYDIN STORE</span>
          <span class="mall-brand-sub" id="mallSub">약국 온라인 몰</span>
        </a>
        <div class="header-actions">
          <button class="icon-btn" type="button" onclick="focusSearch()" aria-label="상품 검색">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <a class="icon-btn" id="cartLink" href="/cart.html" aria-label="장바구니">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="cart-badge" id="cartBadge" hidden>0</span>
          </a>
        </div>
      </div>
    </header>

    <main>
      <div id="mallNotice" class="mall-notice warn" role="status" hidden></div>

      <section class="store-card" id="storeCard" aria-label="약국 정보">
        <div class="store-label">회원 전용 온라인 몰</div>
        <h1 id="storeName">약국</h1>
        <div id="ownerNotice" class="owner-notice" hidden></div>
        <dl class="store-info" id="storeInfo"></dl>
        <div class="store-actions">
          <a class="ghost-btn" id="counselLink" href="#">약사 상담 예약</a>
          <a class="ghost-btn" id="callLink" href="#" hidden>전화 문의</a>
        </div>
      </section>

      <section class="search-section">
        <label class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="storeSearch" type="search" placeholder="상품명·브랜드로 검색" autocomplete="off" />
        </label>
      </section>

      <section class="category-scroll" aria-label="카테고리">
        <div class="chip-list" id="categoryChips"></div>
      </section>

      <section id="popularSection" hidden>
        <div class="section-header"><h2>많이 구매한 상품 <small>최근 30일</small></h2></div>
        <div class="horizontal-products" id="popularProducts"></div>
      </section>

      <section id="newSection" hidden>
        <div class="section-header"><h2>새로 들어온 상품</h2></div>
        <div class="horizontal-products" id="newProducts"></div>
      </section>

      <section id="productsSection">
        <div class="section-header">
          <h2 id="gridTitle">전체 상품 <small id="gridCount"></small></h2>
          <select id="sortSelect" aria-label="정렬">
            <option value="popular">인기순</option>
            <option value="new">신상품순</option>
            <option value="low">낮은 가격순</option>
            <option value="high">높은 가격순</option>
          </select>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </section>

      <div id="footer"></div>
    </main>

    <nav class="bottom-nav">
      <a href="#" class="nav-item active" onclick="window.scrollTo({ top: 0, behavior: 'smooth' }); return false;">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>홈</span>
      </a>
      <a href="#" class="nav-item" id="orderNavLink">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>주문/예약</span>
      </a>
      <a href="#" class="nav-item" id="historyNavLink">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>내역</span>
      </a>
      <a href="#" class="nav-item" id="myLink">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>마이</span>
      </a>
    </nav>

    <div id="message" class="toast"></div>

    <script src="/app.js"></script>
    <script>
      const pharmacyCode = pharmacyCodeFromUrl();
      const NEW_DAYS = 30;
      let pharmacy = null;
      let mall = null;
      let products = [];
      let popularIds = [];
      let selectedCategory = '전체';
      let alertedProducts = new Map();
      const loggedMisses = new Set();
      let missTimer;

      $('#brandLink').href = withPharmacy('/store.html', pharmacyCode);
      $('#myLink').href = withPharmacy('/order-history.html', pharmacyCode);
      $('#cartLink').href = withPharmacy('/cart.html', pharmacyCode);
      $('#orderNavLink').href = withPharmacy('/order.html', pharmacyCode);
      $('#historyNavLink').href = withPharmacy('/order-history.html', pharmacyCode);
      $('#counselLink').href = withPharmacy('/order-counsel.html', pharmacyCode);

      function toast(text) {
        const target = $('#message');
        target.textContent = text;
        target.classList.add('show');
        window.clearTimeout(window.__toastTimer);
        window.__toastTimer = window.setTimeout(() => target.classList.remove('show'), 2200);
      }

      const categoryOf = (product) => product.category_name || '기타';
      const salePrice = (product) => Number(product.discount_price || product.price || 0);
      const isSoldOut = (product) => product.status === 'SOLD_OUT' || Number(product.stock_quantity) <= 0;
      const productUrl = (product) => withPharmacy(`/product.html?id=${product.id}`, pharmacyCode);

      function discountRate(product) {
        if (!product.discount_price || Number(product.discount_price) >= Number(product.price)) return null;
        return Math.round((1 - Number(product.discount_price) / Number(product.price)) * 100);
      }

      // 등록된 지 30일 이내. 서버 시각은 UTC 'YYYY-MM-DD HH:MM:SS'.
      function isNew(product) {
        const created = Date.parse(`${String(product.created_at || '').replace(' ', 'T')}Z`);
        return Number.isFinite(created) && Date.now() - created < NEW_DAYS * 86400000;
      }

      function popularRank(product) {
        const index = popularIds.indexOf(product.id);
        return index < 0 ? Infinity : index;
      }

      function imageBox(product, ...extras) {
        const src = safeUrl(product.thumbnail_url);
        const placeholder = () => el('span', { class: 'placeholder' }, product.brand || categoryOf(product));
        const image = src
          ? el('img', {
              src,
              alt: product.product_name || '',
              loading: 'lazy',
              referrerpolicy: 'no-referrer',
              onerror: (event) => event.currentTarget.replaceWith(placeholder())
            })
          : placeholder();
        return el('div', { class: 'img-box' }, ...extras, image);
      }

      function priceBlock(product) {
        const rate = discountRate(product);
        return el(
          'div',
          { class: 'price-wrap' },
          rate ? el('span', { class: 'discount' }, `${rate}%`) : null,
          el('span', { class: 'price' }, money(salePrice(product))),
          rate ? el('span', { class: 'list-price' }, money(product.price)) : null
        );
      }

      // 실제 데이터로만 붙는 표시: 판매 순위·신상품·품절.
      function badges(product) {
        const rank = popularRank(product);
        return el(
          'div',
          { class: 'badge-wrap' },
          rank < 3 && el('span', { class: 'tag blue' }, '인기'),
          isNew(product) && el('span', { class: 'tag dark' }, 'NEW'),
          isSoldOut(product) && el('span', { class: 'tag red' }, '품절')
        );
      }

      function miniCard(product, rank) {
        return el(
          'a',
          { class: 'h-card', href: productUrl(product) },
          imageBox(product, rank ? el('span', { class: 'rank-badge' }, String(rank)) : null, isSoldOut(product) ? el('div', { class: 'badge-wrap' }, el('span', { class: 'tag red' }, '품절')) : null),
          el('div', { class: 'card-name' }, product.product_name),
          priceBlock(product)
        );
      }

      function renderStoreCard() {
        $('#mallSub').textContent = mallSubtitle(pharmacy);
        $('#storeName').textContent = pharmacy.pharmacy_name;
        $('#ownerNotice').textContent = mall?.notice || '';
        $('#ownerNotice').hidden = !mall?.notice;
        const rows = [
          ['배송', shippingSummary(mall)],
          ['주소', pharmacy.address],
          ['전화', pharmacy.phone]
        ].filter(([, value]) => value);
        $('#storeInfo').replaceChildren(...rows.map(([label, value]) => el('div', {}, el('dt', {}, label), el('dd', {}, value))));
        if (pharmacy.phone) {
          $('#callLink').href = `tel:${pharmacy.phone.replace(/[^0-9+]/g, '')}`;
          $('#callLink').hidden = false;
        }
      }

      function renderCategories() {
        const counts = new Map();
        for (const product of products) counts.set(categoryOf(product), (counts.get(categoryOf(product)) || 0) + 1);
        const categories = [['전체', products.length], ...[...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))];
        $('#categoryChips').replaceChildren(
          ...categories.map(([category, count]) =>
            el(
              'button',
              { type: 'button', class: category === selectedCategory ? 'chip active' : 'chip', onclick: () => filterCategory(category) },
              category,
              el('small', {}, String(count))
            )
          )
        );
      }

      function renderShelves() {
        const browsing = !searchQuery() && selectedCategory === '전체';
        const popular = popularIds.map((id) => products.find((p) => p.id === id)).filter(Boolean).slice(0, 10);
        $('#popularProducts').replaceChildren(...popular.map((product, index) => miniCard(product, index + 1)));
        $('#popularSection').hidden = !browsing || popular.length === 0;

        const fresh = products.filter(isNew).sort((a, b) => b.id - a.id).slice(0, 10);
        $('#newProducts').replaceChildren(...fresh.map((product) => miniCard(product)));
        // 상품이 모두 새 상품이면(막 연 몰) 전체 목록과 같으므로 따로 보이지 않는다.
        $('#newSection').hidden = !browsing || fresh.length === 0 || fresh.length === products.length;
      }

      function sorted(list) {
        const mode = $('#sortSelect').value;
        const byNew = (a, b) => b.id - a.id;
        const compare = {
          popular: (a, b) => popularRank(a) - popularRank(b) || byNew(a, b),
          new: byNew,
          low: (a, b) => salePrice(a) - salePrice(b) || byNew(a, b),
          high: (a, b) => salePrice(b) - salePrice(a) || byNew(a, b)
        }[mode];
        // 품절 상품은 정렬과 상관없이 뒤로 보낸다.
        return [...list].sort((a, b) => Number(isSoldOut(a)) - Number(isSoldOut(b)) || compare(a, b));
      }

      function searchQuery() {
        return $('#storeSearch').value.trim();
      }

      function focusSearch() {
        $('#storeSearch').focus();
        $('#storeSearch').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function matchesSearch(product, query) {
        const text = `${product.product_name} ${product.brand || ''} ${product.category_name || ''} ${product.description || ''}`.toLowerCase();
        return query.toLowerCase().split(/\s+/).every((word) => text.includes(word));
      }

      function logSearchMiss(query) {
        clearTimeout(missTimer);
        missTimer = setTimeout(() => {
          if (query !== searchQuery() || loggedMisses.has(query)) return;
          loggedMisses.add(query);
          api.request('/demand/search-miss', { method: 'POST', body: { pharmacyCode, query } }).catch(() => {});
        }, 1200);
      }

      function requestBox(query) {
        return el(
          'div',
          { class: 'request-box' },
          el('h4', {}, `'${query}' 상품이 아직 없어요`),
          el('p', { class: 'muted' }, '찾는 상품을 약국에 요청하면 입고를 검토하고 답변해 드려요.'),
          el('input', { id: 'requestName', maxlength: 80, value: query, placeholder: '찾는 상품 이름' }),
          el('input', { id: 'requestMemo', maxlength: 200, placeholder: '용량·브랜드 등 메모 (선택)' }),
          el('button', { type: 'button', class: 'add-btn', style: 'width: 100%;', onclick: requestProduct }, '약국에 요청하기')
        );
      }

      async function requestProduct() {
        if (!isCustomerInThisStore()) return toast('상품 요청은 이 약국몰 회원만 할 수 있어요.');
        try {
          await api.request('/demand/me/product-requests', {
            method: 'POST',
            body: { product_name: $('#requestName').value, memo: $('#requestMemo').value }
          });
          toast('요청했어요. 약국 답변은 마이 > 상품 요청에서 볼 수 있어요.');
          $('#storeSearch').value = '';
          renderAll();
        } catch (error) {
          toast(error.message);
        }
      }

      async function loadAlerts() {
        if (!isCustomerInThisStore()) return;
        try {
          const { alerts } = await api.request('/demand/me/restock-alerts');
          alertedProducts = new Map(alerts.filter((a) => a.status === 'WAITING').map((a) => [a.product_id, a.id]));
          renderProductGrid();
        } catch {
          alertedProducts = new Map();
        }
      }

      async function toggleRestockAlert(productId) {
        if (!isCustomerInThisStore()) return toast('입고 알림은 이 약국몰 회원만 신청할 수 있어요.');
        try {
          if (alertedProducts.has(productId)) {
            await api.request(`/demand/me/restock-alerts/${alertedProducts.get(productId)}`, { method: 'DELETE' });
            toast('입고 알림을 취소했어요.');
          } else {
            await api.request('/demand/me/restock-alerts', { method: 'POST', body: { product_id: productId } });
            toast('입고되면 알려 드릴게요.');
          }
          await loadAlerts();
        } catch (error) {
          toast(error.message);
        }
      }

      function cardButton(product) {
        if (!isSoldOut(product)) return el('button', { type: 'button', class: 'add-btn', onclick: () => addCart(product.id) }, '장바구니 담기');
        const on = alertedProducts.has(product.id);
        return el(
          'button',
          { type: 'button', class: on ? 'add-btn alert-btn on' : 'add-btn alert-btn', onclick: () => toggleRestockAlert(product.id) },
          on ? '입고 알림 신청됨' : '입고 알림 받기'
        );
      }

      function emptyGridMessage(query) {
        if (query) return `'${query}' 검색 결과가 ${selectedCategory === '전체' ? '' : `${selectedCategory}에는 `}없어요.`;
        if (products.length) return '이 카테고리에는 상품이 없어요.';
        return isCustomerInThisStore()
          ? '아직 이 몰에서 온라인으로 판매하는 상품이 없어요. 약국에 방문해 약사와 상담해 보세요.'
          : '고객 몰에 보이는 상품이 없습니다. 파트너센터 상품 관리에서 "일반 상품"으로 분류하고 "온라인 판매"를 켠 상품만 고객에게 보입니다.';
      }

      function renderProductGrid() {
        const query = searchQuery();
        const inCategory = selectedCategory === '전체' ? products : products.filter((product) => categoryOf(product) === selectedCategory);
        const visible = sorted(query ? inCategory.filter((product) => matchesSearch(product, query)) : inCategory);
        $('#gridTitle').firstChild.textContent = query ? '검색 결과 ' : selectedCategory === '전체' ? '전체 상품 ' : `${selectedCategory} `;
        $('#gridCount').textContent = `${visible.length.toLocaleString()}개`;

        if (query && !visible.length && !products.some((product) => matchesSearch(product, query))) {
          logSearchMiss(query);
          return $('#productGrid').replaceChildren(requestBox(query));
        }
        if (!visible.length) return $('#productGrid').replaceChildren(el('p', { class: 'empty' }, emptyGridMessage(query)));

        $('#productGrid').replaceChildren(
          ...visible.map((product) =>
            el(
              'article',
              { class: 'v-card' },
              el(
                'a',
                { href: productUrl(product) },
                imageBox(product, badges(product)),
                el('div', { class: 'card-brand' }, product.brand || categoryOf(product)),
                el('div', { class: 'card-name' }, product.product_name),
                priceBlock(product)
              ),
              cardButton(product)
            )
          )
        );
      }

      function renderAll() {
        renderCategories();
        renderShelves();
        renderProductGrid();
      }

      function filterCategory(category) {
        selectedCategory = category;
        renderAll();
        $('#productsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      $('#storeSearch').addEventListener('input', () => {
        if (searchQuery() && selectedCategory !== '전체') selectedCategory = '전체';
        renderAll();
      });
      $('#sortSelect').addEventListener('change', renderProductGrid);

      function isCustomerInThisStore() {
        const user = currentUser();
        return user?.role === 'CUSTOMER' && pharmacy && Number(user.pharmacy_id) === Number(pharmacy.id);
      }

      async function refreshCartBadge() {
        const data = await api.request('/cart');
        const count = data.items.reduce((sum, item) => sum + Number(item.quantity), 0);
        $('#cartBadge').textContent = count > 99 ? '99+' : String(count);
        $('#cartBadge').hidden = count === 0;
      }

      async function addCart(productId) {
        if (!isCustomerInThisStore()) return toast('약국 계정으로 미리 보는 중에는 장바구니에 담을 수 없어요.');
        try {
          await api.request('/cart', { method: 'POST', body: { product_id: productId, quantity: 1 } });
          toast('장바구니에 담았어요.');
          await refreshCartBadge();
        } catch (error) {
          toast(error.message);
        }
      }

      async function loadStore() {
        try {
          const data = await api.request(`/pharmacies/by-code/${encodeURIComponent(pharmacyCode)}`);
          pharmacy = data.pharmacy;
          mall = data.mall;
          document.title = mallTitle(pharmacy);
          renderStoreCard();
          $('#footer').replaceWith(sellerFooter(data.seller));

          const productData = await api.request(`/products/mall?pharmacyCode=${encodeURIComponent(pharmacyCode)}`);
          products = productData.products;
          popularIds = productData.popular_ids || [];
          if (!popularIds.length) $('#sortSelect').value = 'new';
          $('#mallNotice').textContent = productData.notice || '';
          $('#mallNotice').hidden = !productData.online_paused;
          renderAll();

          if (isCustomerInThisStore()) await Promise.all([refreshCartBadge(), loadAlerts()]);
        } catch (error) {
          if (!handleMallAuthError(error, pharmacyCode)) toast(error.message);
        }
      }

      if (requireMallLogin(pharmacyCode)) loadStore();
    </script>
  </body>
</html>
