<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAYDIN POS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="/pos/pos.css" />
  </head>
  <body class="guest">
    <section class="login-shell" aria-label="POS 로그인">
      <article class="login-card">
        <div class="brand" style="margin-bottom: 14px;">MAYDIN POS</div>
        <h1>카운터 로그인</h1>
        <p>약국 관리자 또는 POS 직원 계정으로 로그인하면 매장 판매를 시작할 수 있습니다.</p>
        <form id="loginForm">
          <div class="field">
            <label class="label" for="loginEmail">이메일</label>
            <input id="loginEmail" class="input" name="email" autocomplete="username" value="owner@apharmacy.kr" />
          </div>
          <div class="field">
            <label class="label" for="loginPassword">비밀번호</label>
            <input id="loginPassword" class="input" name="password" type="password" autocomplete="current-password" value="owner1234" />
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">로그인</button>
        </form>
        <p style="margin: 16px 0 0; font-size: 13px;"><a href="/owner.html" class="muted">← 파트너센터로 돌아가기</a></p>
      </article>
    </section>

    <div class="pos-shell">
      <header class="topbar">
        <div class="brand">MAYDIN POS</div>
        <div class="top-info">
          <span><strong id="pharmacyName">약국</strong></span>
          <span class="hide-md">영업일 <strong id="businessDate">-</strong></span>
          <span>판매자 <strong id="cashierName">-</strong></span>
          <span class="status-chip" id="sessionChip"><span class="dot idle"></span><span>영업 전</span></span>
          <button class="status-chip terminal-chip hide-md" id="terminalChip" type="button" onclick="openVanSettings()" title="단말기 · VAN 설정">
            <span class="dot idle"></span><span id="terminalName">카운터</span> · <span id="vanModeLabel">카드 수동 승인</span>
          </button>
          <button class="status-chip" id="networkChip" type="button" onclick="openRecovery()" title="장애 대응 · 복구"><span class="dot"></span><span>온라인</span></button>
          <span class="status-chip hide-md" id="stockMasterChip" style="display: none;"></span>
          <button class="status-chip" id="approvalChip" type="button" onclick="openApprovalManager()" style="display: none;" title="결과를 모르거나 판매에 안 쓴 카드 승인"></button>
        </div>
        <div class="top-actions">
          <a class="btn btn-outline btn-sm" href="/owner.html">파트너센터</a>
          <button class="btn btn-outline btn-sm" type="button" onclick="posLogout()">로그아웃</button>
        </div>
      </header>

      <main class="workspace">
        <section class="panel" aria-label="상품 검색">
          <div class="search-area">
            <div class="search-row">
              <div class="search-box">
                <span class="search-icon">⌕</span>
                <input
                  id="searchInput"
                  class="input"
                  placeholder="상품·영수증·회원QR·픽업 바코드를 스캔하거나 상품명을 입력"
                  autocomplete="off"
                  autofocus
                />
                <span class="scan-hint">F2 검색 · Enter 담기</span>
              </div>
              <button class="cam-btn" type="button" onclick="scanWithCamera()" title="카메라로 바코드 스캔">카메라 스캔</button>
            </div>
            <div class="chips" id="categoryChips"></div>
          </div>
          <div class="product-grid" id="productGrid"></div>
        </section>

        <aside class="panel" aria-label="판매 목록">
          <div class="cart-head">
            <div id="modeBanner"></div>
            <div id="customerBox"></div>
            <div id="counselBox"></div>
          </div>
          <div class="cart-lines" id="cartLines"></div>
          <div class="cart-foot">
            <div class="sum-row"><span>상품 합계</span><span id="subtotal">0원</span></div>
            <div class="sum-row">
              <button class="discount-link" type="button" onclick="openDiscount()">할인 적용</button>
              <span id="discountView">0원</span>
            </div>
            <div class="sum-row total"><span>결제할 금액</span><strong id="finalAmount">0원</strong></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 2.2fr; gap: 8px;">
              <button class="btn btn-outline btn-lg" type="button" onclick="clearCart(true)">비우기</button>
              <button class="btn btn-outline btn-lg" id="holdButton" type="button" onclick="openHoldCurrent()" title="F6">보류</button>
              <button class="btn btn-primary btn-lg" id="payButton" type="button" onclick="openPayment('sale')">결제하기 (F9)</button>
            </div>
          </div>
        </aside>
      </main>

      <nav class="bottom-bar" aria-label="POS 메뉴">
        <button class="menu-btn" type="button" onclick="openPickups()">픽업 주문 <span class="count" id="pickupCount" hidden>0</span></button>
        <button class="menu-btn" type="button" onclick="openCounsels()">복약상담 <span class="count" id="counselCount" hidden>0</span></button>
        <button class="menu-btn" type="button" onclick="openHolds()">보류 목록 <span class="count blue" id="holdCount" hidden>0</span></button>
        <button class="menu-btn" type="button" onclick="openHistory()">거래내역 · 반품</button>
        <button class="menu-btn" type="button" onclick="openInventory()">재고 <span class="count orange" id="stockAlertCount" hidden>0</span></button>
        <button class="menu-btn" type="button" onclick="openCash()">현금 시재</button>
        <button class="menu-btn" type="button" onclick="openReport()">매출 리포트</button>
        <button class="menu-btn" type="button" onclick="openClose()">일마감</button>
        <button class="menu-btn" type="button" onclick="openRecovery()">장애 · 복구 <span class="count orange" id="recoveryCount" hidden>0</span></button>
      </nav>
    </div>

    <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
    <div id="printArea"></div>
    <div class="toast" id="toast"></div>

    <script src="/app.js"></script>
    <script src="/scan-kit.js"></script>
    <script src="/pos/core.js"></script>
    <script src="/pos/auth.js"></script>
    <script src="/pos/local-store.js"></script>
    <script src="/pos/recovery.js"></script>
    <script src="/pos/session.js"></script>
    <script src="/pos/catalog.js"></script>
    <script src="/pos/cart.js"></script>
    <script src="/pos/customer.js"></script>
    <script src="/pos/van-bridge.js"></script>
    <script src="/pos/payment.js"></script>
    <script src="/pos/approvals.js"></script>
    <script src="/pos/receipt.js"></script>
    <script src="/pos/refund.js"></script>
    <script src="/pos/pickup.js"></script>
    <script src="/pos/hold.js"></script>
    <script src="/pos/inventory.js"></script>
    <script src="/pos/terminal.js"></script>
    <script src="/pos/counter.js"></script>
    <script src="/pos/report.js"></script>
    <script src="/pos/main.js"></script>
  </body>
</html>
