                .map((m) => `<button class="method-btn" type="button" onclick="addPayRow('${m}')">${m === 'POINT' ? `포인트 <span class="muted" style="font-size: 12px;">${Number(state.customer.point_balance || 0).toLocaleString()}P</span>` : METHOD_LABELS[m]}</button>`)
                .join('')}
            </div>
            ${rowsHtml || '<div class="notice">결제수단을 선택하세요.</div>'}
            <div class="remain" id="payRemain"></div>
          </div>
          <div class="modal-foot">
            <button class="btn btn-outline" type="button" onclick="closeModal()">취소</button>
            <button class="btn btn-primary btn-lg" id="payConfirm" type="button" onclick="confirmPayment()">결제 완료</button>
          </div>
        `,
          { size: '' }
        );
        renderPaymentStatus();
      }

      function renderPaymentStatus() {
        const target = payTarget();
        const sum = paidSum();
        const remaining = target - sum;
        const el = document.getElementById('payRemain');
        if (!el) return;
        if (remaining === 0 && (state.payRows.length > 0 || target === 0)) {
          el.className = 'remain ok';
          el.innerHTML = '<span>결제 금액 일치</span><span>✓</span>';
        } else if (remaining > 0) {
          el.className = 'remain bad';
          el.innerHTML = `<span>남은 금액</span><span>${won(remaining)}</span>`;
        } else {
          el.className = 'remain bad';
          el.innerHTML = `<span>초과 금액</span><span>${won(-remaining)}</span>`;
        }
        state.payRows.forEach((row, index) => {
          const changeEl = document.getElementById(`change-${index}`);
          if (!changeEl) return;
          const received = Number(row.received_amount);
          const amount = Number(row.amount) || 0;
          if (!row.received_amount) changeEl.textContent = '받은 금액을 입력하면 거스름돈을 계산합니다.';
          else if (received < amount) changeEl.textContent = `받은 금액이 ${won(amount - received)} 부족합니다.`;
          else changeEl.innerHTML = `거스름돈 <b style="font-size: 16px;">${won(received - amount)}</b>`;
        });
        const cardMissing = state.payRows.some((row) => row.method === 'CARD' && !String(row.approval_number).trim());
        let pointInvalid = false;
        state.payRows.forEach((row, index) => {
          if (row.method !== 'POINT') return;
          const warn = document.getElementById(`point-warn-${index}`);
          const amount = Number(row.amount) || 0;
          const policy = state.ctx.point_policy;
          const message =
            amount > (state.customer?.point_balance || 0)
              ? '보유 포인트보다 많이 사용할 수 없습니다.'
              : amount > pointEligibleAmount()
                ? '일반의약품을 뺀 금액까지만 포인트로 결제할 수 있습니다.'
                : amount < policy.min_use
                  ? `${Number(policy.min_use).toLocaleString()}P 이상부터 사용할 수 있습니다.`
                  : '';
          if (message) pointInvalid = true;
          if (warn) {
            warn.style.display = message ? '' : 'none';
            warn.className = 'notice danger';
            warn.textContent = message;
          }
        });
        document.getElementById('payConfirm').disabled =
          remaining !== 0 || (state.payRows.length === 0 && target !== 0) || cardMissing || pointInvalid;
      }

      function payloadPayments() {
        return state.payRows.map((row) => ({
          method: row.method,
          amount: Number(row.amount),
          van_transaction_id: row.van?.id,
          approval_number: row.van ? undefined : row.approval_number || undefined,
          card_company: row.van ? undefined : row.card_company || undefined,
          received_amount: row.received_amount === '' ? undefined : Number(row.received_amount),
          cash_receipt_number: row.cash_receipt_number || undefined
        }));
      }

      function confirmPayment() {
        withBusy(async () => {
          document.getElementById('payConfirm').disabled = true;
          if (state.payMode === 'pickup') {
            await api.request(`/pos/pickups/${state.pickup.order.id}/complete`, {
              method: 'POST',
              body: { payments: payloadPayments() }
            });
            state.payOpen = false;
            toast('결제와 픽업 수령이 완료되었습니다.');
            state.pickup = null;
            await refreshSession();
            refreshBadges();
            openPickups();
            return;
          }

          const receipt = await api.request('/pos/sales', {
            method: 'POST',
            body: {
              customer_id: state.customer?.id || null,
              counsel_order_id: state.counsel?.id || null,
              items: state.cart.map((line) => ({ product_id: line.product.id, quantity: line.quantity })),
              discount_amount: totals().discount,
              discount_reason: state.discount.reason,
              payments: payloadPayments()
            }
          });
          state.payOpen = false;
          state.payRows = [];
          clearCart();
          await Promise.all([refreshSession(), loadProducts()]);
          refreshBadges();
          showReceipt(receipt, { fresh: true });
        }).finally(() => {
          const button = document.getElementById('payConfirm');
          if (button) renderPaymentStatus();
        });
      }

      /* ---------- 영수증 ---------- */

      function receiptHtml(r, { reprint = false } = {}) {
        const { pharmacy, order, items, payments } = r;
        const isRefund = order.order_type === 'POS_REFUND';
        const hasOtc = items.some((i) => i.product_type === 'OTC');
        return `
          <div class="receipt">
            <h3>${h(pharmacy?.pharmacy_name || '')}</h3>
            <div class="center">${h(pharmacy?.address || '')}</div>
            <div class="center">대표 ${h(pharmacy?.owner_name || '')}${pharmacy?.business_number ? ` · 사업자 ${h(pharmacy.business_number)}` : ''}</div>
            ${pharmacy?.phone ? `<div class="center">TEL ${h(pharmacy.phone)}</div>` : ''}
            <div class="title-tag">${isRefund ? '반품(취소) 영수증' : '영수증'}${reprint ? ' · 재출력' : ''}</div>
            <div class="row"><span>거래번호</span><span>${h(order.order_number)}</span></div>
            ${isRefund ? `<div class="row"><span>원거래</span><span>${h(order.original_order_number || '-')}</span></div>` : ''}
            <div class="row"><span>일시</span><span>${fmtDateTime(order.created_at)}</span></div>
            <div class="row"><span>판매자</span><span>${h(order.cashier_name || '-')}</span></div>
            <div class="row"><span>고객</span><span>${order.customer_id ? `${h(order.customer_name)} ${h(maskPhone(order.customer_phone))}` : '비회원'}</span></div>
            <div class="hr"></div>
            ${items
              .map(
                (i) => `
                <div class="bold">${h(i.product_name)}${i.product_type === 'OTC' ? ' [일반의약품]' : ''}</div>
                <div class="row"><span>${won(i.price)} × ${Math.abs(i.quantity)}</span><span>${signedWon(i.total_price)}</span></div>
                ${!isRefund && i.refunded_quantity > 0 ? `<div class="row"><span>  └ 반품 ${i.refunded_quantity}개</span><span>-${won(i.refunded_amount)}</span></div>` : ''}
              `
              )
              .join('')}
            <div class="hr"></div>
            <div class="row"><span>상품 합계</span><span>${signedWon(order.total_product_amount)}</span></div>
            ${order.discount_amount ? `<div class="row"><span>할인${order.discount_reason ? `(${h(order.discount_reason)})` : ''}</span><span>${signedWon(-order.discount_amount)}</span></div>` : ''}
            <div class="row big"><span>${isRefund ? '환불 금액' : '결제 금액'}</span><span>${signedWon(order.final_amount)}</span></div>
            <div class="hr"></div>
            ${payments
              .map(
                (p) => `
                <div class="row"><span>${METHOD_LABELS[p.payment_method] || h(p.payment_method)}${p.card_company ? `(${h(p.card_company)})` : ''}${p.payment_provider === 'VAN_DEMO' ? ' [데모]' : ''}</span><span>${signedWon(p.paid_amount)}</span></div>
                ${p.payment_method === 'CARD' && p.paid_amount > 0 && p.installment_months != null ? `<div class="row"><span>  할부</span><span>${p.installment_months ? `${p.installment_months}개월` : '일시불'}</span></div>` : ''}
                ${p.approval_number ? `<div class="row"><span>  ${p.paid_amount < 0 ? '취소 승인번호' : '승인번호'}</span><span>${h(p.approval_number)}</span></div>` : ''}
                ${p.received_amount ? `<div class="row"><span>  받은 금액</span><span>${won(p.received_amount)}</span></div><div class="row"><span>  거스름돈</span><span>${won(p.change_amount)}</span></div>` : ''}
                ${p.cash_receipt_number ? `<div class="row"><span>  현금영수증</span><span>${h(p.cash_receipt_number)}</span></div>` : ''}
              `
              )
              .join('')}
            ${
              r.points && (r.points.earned || payments.some((p) => p.payment_method === 'POINT'))
                ? `<div class="hr"></div>
                   ${r.points.earned ? `<div class="row"><span>${r.points.earned > 0 ? '적립 포인트' : '적립 취소'}</span><span>${r.points.earned > 0 ? '+' : ''}${r.points.earned.toLocaleString()}P</span></div>` : ''}
                   ${r.points.balance != null ? `<div class="row"><span>현재 포인트 잔액</span><span>${r.points.balance.toLocaleString()}P</span></div>` : ''}`
                : ''
            }
            ${order.order_status === 'CANCELED' ? '<div class="title-tag">전체 취소된 거래</div>' : ''}
            ${order.refund_reason && isRefund ? `<div>사유: ${h(order.refund_reason)}</div>` : ''}
            <div class="hr"></div>
            ${payments.some((p) => p.payment_provider === 'VAN_DEMO') ? '<div class="center bold">※ VAN 데모 승인 거래 · 실제 결제 아님</div>' : ''}
            ${hasOtc ? '<div class="center">일반의약품은 약사와 상담 후 용법·용량을 지켜 복용하세요.</div>' : ''}
            <div class="center">이용해 주셔서 감사합니다.</div>
            <svg class="rcpt-barcode" data-barcode="${h(order.order_number)}" data-height="42" data-width="1.4"></svg>
            ${isRefund ? '' : '<div class="center" style="font-size: 11px;">교환·반품 시 이 바코드를 보여 주세요</div>'}
          </div>
        `;
      }

      async function printReceipt(r, options = {}) {
        const area = document.getElementById('printArea');
        area.innerHTML = receiptHtml(r, options);
        await ScanKit.renderBarcodes(area).catch(() => {});
        setTimeout(() => window.print(), 50);
      }

      function showReceipt(r, { fresh = false } = {}) {
        window.__lastReceipt = r;
        const changeRow = r.payments.find((p) => p.change_amount);
        openModal(`
          ${modalHead(fresh ? '결제 완료' : '영수증')}
          <div class="modal-body" style="background: var(--bg-canvas);">
            ${fresh ? `<div class="notice" style="background: var(--success-soft); color: var(--success); margin-bottom: 14px; font-size: 15px;">판매가 저장되었습니다 · ${won(r.order.final_amount)}${changeRow ? ` · 거스름돈 <b>${won(changeRow.change_amount)}</b>` : ''}</div>` : ''}
            ${receiptHtml(r)}
          </div>
          <div class="modal-foot">
            <button class="btn btn-outline" type="button" onclick="printReceipt(window.__lastReceipt)">영수증 인쇄</button>
            <button class="btn btn-primary" type="button" onclick="closeModal()" data-autofocus>${fresh ? '다음 판매 (Enter)' : '닫기'}</button>
          </div>
        `);
      }

      /* ---------- 거래내역 · 취소 · 반품 ---------- */

      function statusBadge(order) {
        if (order.order_type === 'POS_REFUND') return '<span class="badge red">반품</span>';
        const map = {
          COMPLETED: ['green', '완료'],
          CANCELED: ['gray', '전체취소'],
          PARTIALLY_REFUNDED: ['orange', '부분반품'],
          REFUNDED: ['gray', '반품완료']
        };
        const [color, text] = map[order.order_status] || ['gray', order.order_status];
        return `<span class="badge ${color}">${text}</span>`;
      }

      function openHistory(date = state.ctx.today, query = '') {
        openModal(
          `
          ${modalHead('거래내역 · 취소 · 반품')}
          <div class="modal-body">
            <div style="display: grid; grid-template-columns: 180px 1fr auto auto; gap: 8px; margin-bottom: 14px;">
              <input id="historyDate" class="input" type="date" value="${h(date)}" />
              <input id="historyQuery" class="input" placeholder="영수증 바코드 스캔 · 거래번호 · 고객명 · 전화번호" value="${h(query)}" data-autofocus />
              <button class="cam-btn" type="button" onclick="scanReceiptWithCamera()">영수증 스캔</button>
              <button class="btn btn-primary" type="button" onclick="loadHistory()">조회</button>
            </div>
            <div id="historyList" class="muted">불러오는 중…</div>
          </div>
        `,
          { size: 'xwide' }
        );
        document.getElementById('historyDate').addEventListener('change', loadHistory);
        document.getElementById('historyQuery').addEventListener('keydown', async (event) => {
          if (event.key !== 'Enter') return;
          event.preventDefault();
          const code = event.target.value.trim();
          if (code && (await openReceiptByCode(code, { quiet: true }))) return;
          loadHistory();
        });
        loadHistory();
      }

      async function openReceiptByCode(code, { quiet = false } = {}) {
        try {
          const result = await api.request(`/pos/scan?code=${encodeURIComponent(code)}`);
          if (result.type === 'SALE') {
            openSaleDetail(result.order_id);
            return true;
          }
          if (!quiet) toast('일치하는 POS 거래가 없습니다. 영수증 하단 바코드를 스캔해 주세요.', 'error');
        } catch (error) {
          if (!quiet) toast(error.message, 'error');
        }
        return false;
      }

      function scanReceiptWithCamera() {
        ScanKit.openCameraScanner({
          title: '영수증 바코드 스캔',
          hint: '영수증 맨 아래 바코드를 비추면 원거래를 바로 엽니다.',
          onResult: (code) => openReceiptByCode(code)
        });
      }

      async function loadHistory() {
        const date = document.getElementById('historyDate').value;
        const query = document.getElementById('historyQuery').value.trim();
        try {
          const params = new URLSearchParams({ date });
          if (query) params.set('query', query);
          const data = await api.request(`/pos/sales?${params}`);
          const box = document.getElementById('historyList');
          if (!box) return;
          if (data.sales.length === 0) {
            box.innerHTML = '<div class="empty">거래가 없습니다.</div>';
            return;
          }
          const net = data.sales.reduce((sum, s) => sum + s.final_amount, 0);
          box.innerHTML = `
            <div class="muted" style="font-weight: 700; margin-bottom: 8px;">${data.sales.length}건 · 순매출 ${signedWon(net)}</div>
            <table>
              <thead><tr><th>시간</th><th>거래번호</th><th>구분</th><th>고객</th><th>상품</th><th>결제</th><th class="num">금액</th><th>판매자</th></tr></thead>
              <tbody>
                ${data.sales
                  .map(
                    (s) => `
                    <tr class="clickable" onclick="openSaleDetail(${s.id})">
                      <td>${query ? fmtDateTime(s.created_at) : fmtTime(s.created_at)}</td>
                      <td style="font-weight: 700;">${h(s.order_number)}${s.original_order_number ? `<div class="muted" style="font-size: 12px;">원거래 ${h(s.original_order_number)}</div>` : ''}</td>
                      <td>${statusBadge(s)}</td>
                      <td>${h(s.customer_name)}</td>
                      <td style="max-width: 280px; font-size: 13px;">${h(s.items_summary || '')}</td>
                      <td style="font-size: 13px;">${(s.payment_methods || '').split(',').filter(Boolean).map((m) => METHOD_LABELS[m] || m).join(' + ')}</td>
                      <td class="num" style="font-weight: 800; ${s.final_amount < 0 ? 'color: var(--danger);' : ''}">${signedWon(s.final_amount)}</td>
                      <td>${h(s.cashier_name || '-')}</td>
                    </tr>
                  `
                  )
                  .join('')}
              </tbody>
            </table>
          `;
        } catch (error) {
          toast(error.message, 'error');
        }
      }

      async function openSaleDetail(id) {
        try {
          const r = await api.request(`/pos/sales/${id}`);
          window.__detail = r;
          const { order, refunds, permissions } = r;
          openModal(
            `
            ${modalHead(`거래 상세 · ${h(order.order_number)}`)}
            <div class="modal-body">
              <div class="split">
                <div style="background: var(--bg-canvas); border-radius: 16px; padding: 16px;">${receiptHtml(r)}</div>
                <div>
                  <div class="section-title">처리</div>
                  <div class="list">
                    <button class="btn btn-outline btn-block" type="button" onclick="reprint(${order.id})">영수증 재출력</button>
                    ${permissions.can_cancel ? `<button class="btn btn-danger-soft btn-block" type="button" onclick="openCancel()">당일 전체 취소</button>` : ''}
                    ${permissions.can_refund ? `<button class="btn btn-soft btn-block" type="button" onclick="openRefund()">부분 반품</button>` : ''}
                    ${order.original_order_id ? `<button class="btn btn-outline btn-block" type="button" onclick="openSaleDetail(${order.original_order_id})">원거래 보기</button>` : ''}
                  </div>
                  ${!isOwner() && order.order_type === 'POS_SALE' ? '<div class="notice" style="margin-top: 10px;">취소·반품은 약국 관리자 계정으로 처리할 수 있습니다.</div>' : ''}
                  ${order.order_type === 'POS_SALE' && order.order_status === 'COMPLETED' && !permissions.can_cancel && isOwner() ? '<div class="notice" style="margin-top: 10px;">지난 거래는 전체 취소 대신 부분 반품으로 처리합니다.</div>' : ''}
                  ${refunds.length
                    ? `<div class="section-title">반품 · 취소 이력</div>
                       <div class="list">${refunds
                         .map(
                           (rf) => `
                           <button class="list-item" type="button" onclick="openSaleDetail(${rf.id})">
                             <div><div style="font-weight: 800;">${rf.refund_type === 'CANCEL' ? '전체 취소' : '부분 반품'} · ${h(rf.order_number)}</div>
                             <div class="muted" style="font-size: 13px;">${fmtDateTime(rf.created_at)} · ${h(rf.created_by_name || '')} · ${h(rf.refund_reason || '')}</div></div>
                             <strong style="color: var(--danger);">${signedWon(rf.final_amount)}</strong>
                           </button>`
                         )
                         .join('')}</div>`
                    : ''}
                  <div style="margin-top: 16px;"><button class="btn btn-outline btn-block" type="button" onclick="openHistory()">← 거래내역으로</button></div>
                </div>
              </div>
            </div>
          `,
            { size: 'wide' }
          );
        } catch (error) {
          toast(error.message, 'error');
        }
      }

      function reprint(id) {
        withBusy(async () => {
          const r = await api.request(`/pos/sales/${id}/reprint`, { method: 'POST' });
          printReceipt(r, { reprint: true });
          toast('영수증을 재출력합니다.');
        });
      }

      function reasonChips(targetId, reasons) {
        return `<div class="chips" style="margin-bottom: 14px;">${reasons
          .map((r) => `<button class="chip" type="button" onclick="document.getElementById('${targetId}').value='${r}'">${r}</button>`)
          .join('')}</div>`;
      }

      function openCancel() {
        const r = window.__detail;
        const hasCard = r.payments.some((p) => p.payment_method === 'CARD' && p.paid_amount > 0 && p.payment_provider !== 'VAN_DEMO');
        const hasVanDemo = r.payments.some((p) => p.paid_amount > 0 && p.payment_provider === 'VAN_DEMO');
        openModal(`
          ${modalHead('당일 전체 취소')}
          <div class="modal-body">
            <div class="pay-total"><span class="muted" style="font-weight: 700;">${h(r.order.order_number)} 환불 금액</span><div class="amount" style="color: var(--danger);">${won(r.order.final_amount)}</div></div>
            ${r.payments
              .filter((p) => p.paid_amount > 0)
              .map((p) => `<div class="kv"><span>${METHOD_LABELS[p.payment_method]}${p.approval_number ? ` (승인 ${h(p.approval_number)})` : ''}</span><span>${won(p.paid_amount)} 환불</span></div>`)
              .join('')}
            ${hasCard ? `<div class="notice warn" style="margin: 10px 0;">카드 결제분은 기존 단말기에서 먼저 <b>승인 취소</b>한 뒤 진행하세요.</div>
              <div class="field"><label class="label" for="cancelApproval">카드 취소 승인번호 (선택)</label><input id="cancelApproval" class="input" placeholder="단말기 취소 영수증의 승인번호" /></div>` : ''}
            ${hasVanDemo ? '<div class="notice" style="margin: 10px 0; background: #f3e8ff; color: #6d28d9;">VAN 자동 승인(데모) 결제분은 확정 시 <b>VAN 자동 취소 (데모)</b>로 취소 승인번호가 발급됩니다.</div>' : ''}
            <div class="field" style="margin-top: 12px;"><label class="label" for="cancelReason">취소 사유 (필수)</label><input id="cancelReason" class="input" data-autofocus /></div>
            ${reasonChips('cancelReason', ['고객 변심', '결제 수단 변경', '금액 입력 오류', '상품 불량'])}
            <label style="display: flex; gap: 8px; align-items: center; font-weight: 700;"><input id="cancelRestock" type="checkbox" checked /> 상품을 재고로 되돌리기 (재입고)</label>
          </div>
          <div class="modal-foot">
            <button class="btn btn-outline" type="button" onclick="openSaleDetail(${r.order.id})">돌아가기</button>
            <button class="btn btn-danger" type="button" onclick="confirmCancel()">전체 취소 확정</button>
          </div>
        `);
      }

      function confirmCancel() {
        const r = window.__detail;
        withBusy(async () => {
          const reason = document.getElementById('cancelReason').value.trim();
          if (!reason) throw new Error('취소 사유를 입력해 주세요.');
          const data = await api.request(`/pos/sales/${r.order.id}/cancel`, {
            method: 'POST',
            body: {
              reason,
              restock: document.getElementById('cancelRestock').checked,
              card_cancel_approval_number: document.getElementById('cancelApproval')?.value.trim() || undefined
            }
          });
          await Promise.all([refreshSession(), loadProducts()]);
          toast(`전체 취소 완료 · ${won(-data.refund.order.final_amount)} 환불`);
          showReceipt(data.refund);
        });
      }

      function estimateRefund(item, qty) {
        if (!qty) return 0;
        const net = item.total_price - (item.discount_amount || 0);
        const remaining = item.quantity - (item.refunded_quantity || 0);
        return qty === remaining ? net - (item.refunded_amount || 0) : Math.floor((net * qty) / item.quantity);
      }

      function openRefund() {
        const r = window.__detail;
        const balances = Object.entries(r.payment_balances || {}).filter(([, v]) => v > 0);
        const multi = balances.length > 1;
        openModal(
          `
          ${modalHead('부분 반품')}
          <div class="modal-body">
            <table>
              <thead><tr><th>상품</th><th class="num">판매</th><th class="num">반품 가능</th><th class="num">반품 수량</th><th class="num">환불 예정</th></tr></thead>
              <tbody>
                ${r.items
                  .map(
                    (item) => `
                    <tr>
                      <td style="font-weight: 700;">${h(item.product_name)}<div class="muted" style="font-size: 12px;">${won(item.price)}${item.discount_amount ? ` · 할인 안분 ${won(item.discount_amount)}` : ''}</div></td>
                      <td class="num">${item.quantity}</td>
                      <td class="num">${item.refundable_quantity}</td>
                      <td class="num"><input class="input" style="width: 84px; text-align: center; padding: 8px;" type="number" min="0" max="${item.refundable_quantity}" value="0" data-item="${item.id}" oninput="updateRefundPreview()" ${item.refundable_quantity === 0 ? 'disabled' : ''} /></td>
                      <td class="num" id="refund-est-${item.id}">0원</td>
                    </tr>
                  `
                  )
                  .join('')}
              </tbody>
            </table>
            <div class="remain" style="margin: 14px 0;"><span>환불 금액</span><span id="refundTotal">0원</span></div>
            ${multi
              ? `<div class="notice warn" style="margin-bottom: 10px;">복합결제 거래입니다. 결제수단별 환불 금액을 나눠 입력하세요.</div>
                 <div class="pay-row-grid" style="margin-bottom: 14px;">
                   ${balances
                     .map(
                       ([method, balance]) => `<div><label class="label">${METHOD_LABELS[method]} 환불 (최대 ${won(balance)})</label><input class="input" type="number" min="0" max="${balance}" data-refund-method="${method}" value="0" /></div>`
                     )
                     .join('')}
                 </div>`
              : balances.length === 1
                ? `<div class="notice" style="margin-bottom: 14px;">${METHOD_LABELS[balances[0][0]]}(으)로 환불됩니다.${
                    r.payments.some((p) => p.payment_method === balances[0][0] && p.payment_provider === 'VAN_DEMO')
                      ? ' VAN 자동 부분취소 (데모)로 처리됩니다.'
                      : balances[0][0] === 'CARD'
                        ? ' 카드는 단말기에서 부분 취소 후 진행하세요.'
                        : ''
                  }</div>`
                : ''}
            <div class="field"><label class="label" for="refundReason">반품 사유 (필수)</label><input id="refundReason" class="input" /></div>
            ${reasonChips('refundReason', ['상품 불량', '고객 변심', '유통기한 문제', '오판매'])}
            <label style="display: flex; gap: 8px; align-items: center; font-weight: 700;"><input id="refundRestock" type="checkbox" checked /> 반품 상품을 재고로 되돌리기 (재입고)</label>
          </div>
          <div class="modal-foot">
            <button class="btn btn-outline" type="button" onclick="openSaleDetail(${r.order.id})">돌아가기</button>
            <button class="btn btn-primary" type="button" onclick="confirmRefund()">반품 확정</button>
          </div>
        `,
          { size: 'wide' }
        );
      }

      function refundSelection() {
        const r = window.__detail;
        return [...document.querySelectorAll('[data-item]')]
          .map((input) => {
            const item = r.items.find((i) => i.id === Number(input.dataset.item));
            const qty = Math.max(0, Math.min(Number(input.value) || 0, item.refundable_quantity));
            return { item, qty };
          })
          .filter((row) => row.qty > 0);
      }

      function updateRefundPreview() {
        const r = window.__detail;
        let total = 0;
        for (const item of r.items) {
          const input = document.querySelector(`[data-item="${item.id}"]`);
          const qty = Math.max(0, Math.min(Number(input?.value) || 0, item.refundable_quantity));
          const amount = estimateRefund(item, qty);
          total += amount;
          const cell = document.getElementById(`refund-est-${item.id}`);
          if (cell) cell.textContent = won(amount);
        }
        document.getElementById('refundTotal').textContent = won(total);
        const methodInputs = document.querySelectorAll('[data-refund-method]');
        if (methodInputs.length > 1) {
          const cash = [...methodInputs].find((i) => i.dataset.refundMethod === 'CASH');
          const others = [...methodInputs].filter((i) => i !== cash);
          let left = total;
          for (const input of others) {
            const value = Math.min(Number(input.max), left);
            input.value = value;
            left -= value;
          }
          if (cash) cash.value = Math.min(Number(cash.max), left);
        }
      }

      function confirmRefund() {
        const r = window.__detail;
        withBusy(async () => {
          const selection = refundSelection();
          if (selection.length === 0) throw new Error('반품할 수량을 입력해 주세요.');
          const reason = document.getElementById('refundReason').value.trim();
          if (!reason) throw new Error('반품 사유를 입력해 주세요.');
          const methodInputs = [...document.querySelectorAll('[data-refund-method]')];
          const payments =
            methodInputs.length > 1
              ? methodInputs
                  .map((input) => ({ method: input.dataset.refundMethod, amount: Number(input.value) || 0 }))
                  .filter((p) => p.amount > 0)
              : undefined;
          const data = await api.request(`/pos/sales/${r.order.id}/refunds`, {
            method: 'POST',
            body: {
              reason,
              restock: document.getElementById('refundRestock').checked,
              items: selection.map((row) => ({ order_item_id: row.item.id, quantity: row.qty })),
              payments
            }
          });
          await Promise.all([refreshSession(), loadProducts()]);
          toast(`반품 완료 · ${won(-data.refund.order.final_amount)} 환불`);
          showReceipt(data.refund);
        });
      }

      /* ---------- 픽업 ---------- */

      function openPickups(scope = 'pending', selectId = null) {
        state.pickup = null;
        openModal(
          `
          ${modalHead('온라인 픽업 주문')}
          <div class="modal-body">
            <div style="display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-bottom: 12px;">
              <input id="pickupQuery" class="input" placeholder="픽업 바코드 스캔 · 주문번호 · 고객명 · 전화번호 뒷자리" data-autofocus />
              <button class="cam-btn" type="button" onclick="scanPickupWithCamera('${scope}')">바코드 스캔</button>
              <div class="tabs" style="margin: 0;">
                <button class="chip ${scope === 'pending' ? 'active' : ''}" type="button" onclick="openPickups('pending')">수령 대기</button>
                <button class="chip ${scope === 'all' ? 'active' : ''}" type="button" onclick="openPickups('all')">전체</button>
              </div>
            </div>
            <div class="split">
              <div class="list" id="pickupList" style="align-content: start; max-height: 60vh; overflow-y: auto;"></div>
              <div id="pickupDetail"><div class="notice">왼쪽에서 주문을 선택하세요.</div></div>
            </div>
          </div>
        `,
          { size: 'wide' }
        );
        let timer;
        const input = document.getElementById('pickupQuery');
        input.addEventListener('input', () => {
          clearTimeout(timer);
          timer = setTimeout(() => loadPickups(scope), 200);
        });
        input.addEventListener('keydown', async (event) => {
          if (event.key !== 'Enter') return;
          event.preventDefault();
          clearTimeout(timer);
          if (await selectPickupByCode(input.value.trim())) input.value = '';
          else loadPickups(scope);
        });
        loadPickups(scope).then(() => {
          if (selectId) selectPickup(selectId, document.querySelector(`#pickupList [data-pickup="${selectId}"]`));
        });
      }

      async function selectPickupByCode(code) {
        if (!code) return false;
        try {
          const result = await api.request(`/pos/scan?code=${encodeURIComponent(code)}`);
          if (result.type !== 'PICKUP') return false;
          await selectPickup(result.order_id, document.querySelector(`#pickupList [data-pickup="${result.order_id}"]`));
          return true;
        } catch (error) {
          return false;
        }
      }

      function scanPickupWithCamera(scope) {
        ScanKit.openCameraScanner({
          title: '픽업 주문 바코드 스캔',
          hint: '고객 앱 주문 내역의 픽업 바코드를 비춰 주세요.',
          onResult: async (code) => {
            if (!(await selectPickupByCode(code))) toast('일치하는 픽업 주문이 없습니다.', 'error');
          }
        });
      }

      async function loadPickups(scope) {
        const query = document.getElementById('pickupQuery')?.value.trim() || '';
        try {
          const data = await api.request(`/pos/pickups?scope=${scope}&query=${encodeURIComponent(query)}`);
          const box = document.getElementById('pickupList');
          if (!box) return;
          box.innerHTML = data.pickups.length
            ? data.pickups
                .map(
                  (o) => `
                  <button class="list-item" type="button" data-pickup="${o.id}" onclick="selectPickup(${o.id}, this)">
                    <div>
                      <div style="font-weight: 800;">${h(o.customer_name || '-')} <span class="muted" style="font-size: 13px;">${h(maskPhone(o.customer_phone || o.contact_phone))}</span></div>
                      <div class="muted" style="font-size: 13px; font-weight: 600; margin-top: 2px;">${h(o.order_number)} · 희망 ${h(o.preferred_at || '-')}</div>
                    </div>
                    <div style="text-align: right;">
                      ${['PICKED_UP', 'COMPLETED'].includes(o.order_status) ? '<span class="badge green">수령 완료</span>' : o.order_status === 'CANCELED' ? '<span class="badge gray">취소</span>' : o.payment_status === 'PAID' ? '<span class="badge blue">결제완료</span>' : '<span class="badge orange">현장결제</span>'}
                      <div style="font-weight: 800; margin-top: 4px;">${won(o.final_amount)}</div>
                    </div>
                  </button>
                `
                )
                .join('')
            : '<div class="empty">픽업 주문이 없습니다.</div>';
        } catch (error) {
          toast(error.message, 'error');
        }
      }

      async function selectPickup(id, el) {
        document.querySelectorAll('#pickupList .list-item').forEach((item) => item.classList.remove('selected'));
        el?.classList.add('selected');
        try {
          const data = await api.request(`/pos/pickups/${id}`);
          state.pickup = data;
          const { order, items } = data;
          const done = ['PICKED_UP', 'COMPLETED', 'CANCELED'].includes(order.order_status);
          document.getElementById('pickupDetail').innerHTML = `
            <div class="section-title">${h(order.order_number)}</div>
            <div class="kv"><span>수령인</span><span>${h(order.contact_name || order.customer_name || '-')}</span></div>
            <div class="kv"><span>연락처</span><span>${h(order.contact_phone || order.customer_phone || '-')}</span></div>
            <div class="kv"><span>희망 픽업</span><span>${h(order.preferred_at || '-')}</span></div>
            <div class="kv"><span>주문 일시</span><span>${fmtDateTime(order.created_at)}</span></div>
            ${order.memo ? `<div class="kv"><span>요청사항</span><span>${h(order.memo)}</span></div>` : ''}
            <div class="section-title">상품</div>
            ${items.map((i) => `<div class="kv"><span>${h(i.product_name)} × ${i.quantity}</span><span>${won(i.total_price)}</span></div>`).join('')}
            <div class="kv strong"><span>${order.payment_status === 'PAID' ? '결제 완료 금액' : '카운터 결제 금액'}</span><span>${won(order.final_amount)}</span></div>
            ${done
              ? `<div class="notice" style="margin-top: 12px;">${order.order_status === 'CANCELED' ? '취소된 주문입니다.' : `수령 완료 · ${fmtDateTime(order.picked_up_at)}`}</div>`
              : `
                <label style="display: flex; gap: 8px; align-items: center; font-weight: 700; margin: 14px 0;">
                  <input id="pickupVerified" type="checkbox" /> 수령인 이름과 연락처 뒷자리를 확인했습니다
                </label>
                <button class="btn btn-primary btn-block btn-lg" type="button" onclick="completePickup()">${order.payment_status === 'PAID' ? '수령 완료 처리' : '결제 후 수령 완료'}</button>
              `}
          `;
        } catch (error) {
          toast(error.message, 'error');
        }
      }

      function completePickup() {
        if (!document.getElementById('pickupVerified').checked) return toast('수령인 본인 확인을 체크해 주세요.', 'error');
        const { order } = state.pickup;
        if (order.payment_status !== 'PAID') {
          if (!requireSession()) return;
          return openPayment('pickup');
        }
        withBusy(async () => {
          await api.request(`/pos/pickups/${order.id}/complete`, { method: 'POST', body: {} });
          toast(`${order.order_number} 수령 완료`);
          refreshBadges();
          openPickups();
        });
      }

      /* ---------- 복약상담 ---------- */

      async function openCounsels() {
        try {
          const data = await api.request('/pos/counsels');
          openModal(
            `
            ${modalHead('복약상담 예약')}
            <div class="modal-body">
              <div class="notice" style="margin-bottom: 12px;">일반의약품은 온라인 결제 없이 상담 예약만 받습니다. 상담 후 구매하면 <b>판매 연결</b>을 눌러 현장 판매로 이어가세요.</div>
              <div class="list">
                ${data.counsels.length
                  ? data.counsels
                      .map(
                        (c) => `
                        <div class="list-item" style="align-items: flex-start;">
                          <div style="min-width: 0;">
                            <div style="font-weight: 800;">${h(c.customer_name || c.contact_name || '-')} <span class="muted" style="font-size: 13px;">${h(c.contact_phone || c.customer_phone || '')}</span></div>
                            <div class="muted" style="font-size: 13px; font-weight: 600; margin: 2px 0 6px;">${h(c.order_number)} · 희망 ${h(c.preferred_at || '-')}</div>
                            <div style="font-size: 14px; line-height: 1.5;">${h(c.memo || '')}</div>
                          </div>
                          <div class="list" style="flex-shrink: 0;">
                            <button class="btn btn-primary btn-sm" type="button" onclick='linkCounsel(${JSON.stringify({ id: c.id, order_number: c.order_number, customer_id: c.customer_id })})'>판매 연결</button>
                            <button class="btn btn-outline btn-sm" type="button" onclick="completeCounsel(${c.id})">상담만 완료</button>
                          </div>
                        </div>
                      `
                      )
                      .join('')
                  : '<div class="empty">대기 중인 상담 예약이 없습니다.</div>'}
              </div>
            </div>
          `,
            { size: 'wide' }
          );
        } catch (error) {
          toast(error.message, 'error');
        }
      }

      async function linkCounsel(counsel) {
        state.counsel = counsel;
        if (counsel.customer_id) await selectCustomer(counsel.customer_id, { silent: true });
        renderCustomer();
        closeModal();
        toast('상담 예약을 연결했습니다. 상품을 담아 판매하세요.');
      }

      function completeCounsel(id) {
        if (!confirm('구매 없이 상담을 완료 처리할까요?')) return;
        withBusy(async () => {
          await api.request(`/pos/counsels/${id}/complete`, { method: 'POST' });
          toast('상담을 완료 처리했습니다.');
          refreshBadges();
          openCounsels();
        });
      }

      /* ---------- 보류 판매 ---------- */

      function holdPayload(label) {
        return {
          label,
          customer_id: state.customer?.id || null,
          counsel_order_id: state.counsel?.id || null,
          items: state.cart.map((line) => ({ product_id: line.product.id, quantity: line.quantity })),
          discount_amount: totals().discount,
          discount_reason: state.discount.reason
        };
      }

      function openHoldCurrent() {
        if (!requireSession()) return;
        if (state.cart.length === 0) return toast('보류할 상품이 없습니다.', 'error');
        const t = totals();
        openModal(`
          ${modalHead('판매 보류')}
          <div class="modal-body">
            <div class="pay-total"><span class="muted" style="font-weight: 700;">${state.cart.length}종 · ${state.cart.reduce((s, l) => s + l.quantity, 0)}개</span><div class="amount">${won(t.final)}</div></div>
            <div class="field">
              <label class="label" for="holdLabel">구분 메모 (선택)</label>
              <input id="holdLabel" class="input" maxlength="30" placeholder="예: 파란 점퍼 고객, 처방전 대기" data-autofocus onkeydown="if (event.key === 'Enter') confirmHold()" />
            </div>
            ${reasonChips('holdLabel', ['처방전 대기', '추가 상품 고르는 중', '결제수단 가지러 감', '약사 상담 중'])}
            <div class="notice">보류해도 재고는 차감되지 않습니다. 보류 번호를 고객에게 알려 주고 다음 고객을 받으세요.</div>
          </div>
          <div class="modal-foot">
            <button class="btn btn-outline" type="button" onclick="closeModal()">취소</button>
            <button class="btn btn-primary" type="button" onclick="confirmHold()">보류하기</button>
          </div>
        `);
      }

      function confirmHold() {
        withBusy(async () => {
          const label = document.getElementById('holdLabel')?.value.trim() || '';
          const data = await api.request('/pos/holds', { method: 'POST', body: holdPayload(label) });
          clearCart();
          closeModal();
          setBadge('holdCount', data.hold_count);
          toast(`보류 #${data.hold.hold_number} 저장 · ${won(data.hold.total_amount - data.hold.discount_amount)}`);
        });
      }

      async function openHolds() {
        try {
          const data = await api.request('/pos/holds');
          setBadge('holdCount', data.holds.length);
          openModal(
            `
            ${modalHead('보류 목록')}
            <div class="modal-body">
              <div class="list">
                ${data.holds.length
                  ? data.holds
                      .map(
                        (hold) => `
                        <div class="list-item" style="align-items: flex-start;">
                          <div style="min-width: 0;">
                            <div style="font-weight: 900; font-size: 17px;">#${hold.hold_number} ${hold.label ? `<span style="font-weight: 700; font-size: 15px;">· ${h(hold.label)}</span>` : ''}</div>
                            <div class="muted" style="font-size: 13px; font-weight: 600; margin: 3px 0 6px;">${fmtTime(hold.created_at)} · ${h(hold.created_by_name || '')} · ${hold.customer_name ? `회원 ${h(hold.customer_name)}` : '비회원'}${hold.counsel_order_number ? ` · 상담 ${h(hold.counsel_order_number)}` : ''}</div>
                            <div style="font-size: 14px; line-height: 1.5;">${hold.items.map((i) => `${h(i.product_name)} ×${i.quantity}`).join(', ')}</div>
                          </div>
                          <div style="flex-shrink: 0; text-align: right; display: grid; gap: 6px;">
                            <strong style="font-size: 17px;">${won(hold.total_amount - hold.discount_amount)}</strong>
                            <button class="btn btn-primary btn-sm" type="button" onclick="recallHold(${hold.id})">불러오기</button>
                            <button class="btn btn-danger-soft btn-sm" type="button" onclick="discardHold(${hold.id}, ${hold.hold_number})">폐기</button>
                          </div>
                        </div>`
                      )
                      .join('')
                  : '<div class="empty">보류 중인 판매가 없습니다.<br />판매 목록에서 <b>보류</b>(F6)를 누르면 여기에 저장됩니다.</div>'}
              </div>
            </div>
          `,
            { size: 'wide' }
          );
        } catch (error) {
          toast(error.message, 'error');
        }
      }

      function recallHold(id) {
        withBusy(async () => {
          if (state.cart.length > 0) {
            if (!confirm('현재 판매 목록을 먼저 보류하고 불러올까요?')) return;
            const saved = await api.request('/pos/holds', { method: 'POST', body: holdPayload('자동 보류') });
            toast(`현재 판매를 보류 #${saved.hold.hold_number}(으)로 저장했습니다.`);
          }
          const data = await api.request(`/pos/holds/${id}/recall`, { method: 'POST' });
          clearCart();
          cacheProducts(data.items.map((item) => item.product));
          state.cart = data.items.map((item) => ({ product: item.product, quantity: item.quantity }));
          state.discount = data.discount.amount > 0 ? { amount: data.discount.amount, reason: data.discount.reason || '보류 할인' } : { amount: 0, reason: '' };
          state.counsel = data.counsel;
          if (data.customer) await selectCustomer(data.customer.id, { silent: true });
          renderCustomer();
          renderCart();
          closeModal();
          setBadge('holdCount', data.hold_count);
          if (data.warnings.length) {
            openModal(`
              ${modalHead(`보류 #${data.hold.hold_number} 불러오기 · 변경 사항`)}
              <div class="modal-body">
                <div class="notice warn" style="margin-bottom: 10px;">보류 이후 상품 정보가 바뀌었습니다. 판매 목록을 확인해 주세요.</div>
                ${data.warnings.map((w) => `<div class="kv"><span>${h(w)}</span></div>`).join('')}
              </div>
              <div class="modal-foot"><button class="btn btn-primary" type="button" onclick="closeModal()" data-autofocus>확인</button></div>
            `);
          } else {
            toast(`보류 #${data.hold.hold_number}을(를) 불러왔습니다.`);
          }
        });
      }

      function discardHold(id, number) {
        if (!confirm(`보류 #${number}을(를) 폐기할까요? 되돌릴 수 없습니다.`)) return;
        withBusy(async () => {
          await api.request(`/pos/holds/${id}/discard`, { method: 'POST' });
          toast(`보류 #${number}을(를) 폐기했습니다.`);
          openHolds();
        });
      }

      /* ---------- 재고 처리 ---------- */

      async function openInventory(filter = state.inventory.filter, selectId = state.inventory.selectedId) {
        state.inventory.filter = filter;
        openModal(
          `
          ${modalHead('재고 처리 · 입고 · 폐기 · 실사')}
          <div class="modal-body">
            <div style="display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px;">
              <div>
                <div class="inline-scan" style="margin-bottom: 10px;">
                  <input id="invQuery" class="input" placeholder="바코드 스캔 또는 상품명 (스캔하면 바로 입고 준비)" data-autofocus autocomplete="off" />
                  <button class="cam-btn" type="button" onclick="scanInventoryWithCamera()">카메라</button>
                </div>
                <div class="chips" id="invFilters" style="margin-bottom: 10px;"></div>
                <div id="invList" style="max-height: 58vh; overflow-y: auto;"><div class="muted">불러오는 중…</div></div>
              </div>
              <div id="invDetail"><div class="notice">왼쪽에서 상품을 선택하거나 바코드를 스캔하세요.<br />입고는 직원도, 폐기·실사 조정·안전재고 설정은 관리자만 할 수 있습니다.</div></div>
            </div>
          </div>
        `,
          { size: 'xwide' }
        );
        const input = document.getElementById('invQuery');
        let timer;
        input.addEventListener('input', () => {
          clearTimeout(timer);
          timer = setTimeout(loadInventory, 200);
        });
        input.addEventListener('keydown', async (event) => {
          if (event.key !== 'Enter') return;
          event.preventDefault();
          clearTimeout(timer);
          await inventoryScan(input.value.trim());
        });
        await loadInventory();
        if (selectId) selectInventoryProduct(selectId);
      }

      async function inventoryScan(code) {
        if (!code) return;
        const input = document.getElementById('invQuery');
        const data = await loadInventory(code);
        if (!data) return;
        const target = data.exact_match_id || (data.products.length === 1 ? data.products[0].id : null);
        if (target) {
          if (input) input.value = '';
          await loadInventory('');
          state.inventory.adjustType = 'RECEIVE';
          selectInventoryProduct(target, { focusQty: true });
        } else if (data.products.length === 0 && /^[0-9A-Za-z-]{4,64}$/.test(code) && can('can_register_product')) {
          if (confirm(`${code}은(는) 등록되지 않은 바코드입니다. 지금 상품으로 등록할까요?`)) {
            openUnknownBarcode(code, {
              onDone: (product) => {
                state.inventory.adjustType = 'RECEIVE';
                openInventory('all', product.id);
              }
            });
          }
        } else if (data.products.length === 0) {
          toast('일치하는 상품이 없습니다.', 'error');
        }
      }

      function scanInventoryWithCamera() {
        ScanKit.openCameraScanner({ title: '입고 상품 스캔', onResult: (code) => inventoryScan(code) });
      }

      async function loadInventory(queryOverride) {
        const input = document.getElementById('invQuery');
        const query = queryOverride ?? input?.value.trim() ?? '';
        try {
          const data = await api.request(`/pos/inventory?filter=${state.inventory.filter}&query=${encodeURIComponent(query)}`);
          cacheProducts(data.products);
          window.__inventory = data.products;
          setBadge('stockAlertCount', stockAlertTotal(data.alerts));
          const filters = document.getElementById('invFilters');
          if (filters) {
            filters.innerHTML = [
              ['all', '전체'],
              ['low', `부족 · 품절 ${data.alerts.low_count}`],
              ['out', `품절 ${data.alerts.out_count}`],
              ['expiring', `유통기한 임박 ${data.alerts.expiring_count}`],
              ['expired', `기한 경과 ${data.alerts.expired_count}`]
            ]
              .map(([key, label]) => `<button class="chip ${state.inventory.filter === key ? 'active' : ''}" type="button" onclick="setInventoryFilter('${key}')">${label}</button>`)
              .join('');
          }
          const box = document.getElementById('invList');
          if (!box) return data;
          box.innerHTML = data.products.length
            ? `<table>
                <thead><tr><th>상품</th><th class="num">재고</th><th class="num">안전재고</th><th>상태</th></tr></thead>
                <tbody>${data.products
                  .map(
                    (p) => `
                    <tr class="clickable" onclick="selectInventoryProduct(${p.id})" style="${state.inventory.selectedId === p.id ? 'background: var(--blue-soft);' : ''}">
                      <td><div style="font-weight: 700;">${h(p.product_name)} ${p.product_type === 'OTC' ? '<span class="badge orange">일반의약품</span>' : ''}</div><div class="muted" style="font-size: 12px;">${p.barcode ? h(p.barcode) : '바코드 없음'}${p.nearest_expiry ? ` · ${expiryBadge(p.nearest_expiry, data.alerts.expiry_alert_days)}` : ''}</div></td>
                      <td class="num" style="font-weight: 900; ${p.is_low ? 'color: var(--danger);' : ''}">${p.stock_quantity}</td>
                      <td class="num">${p.safety_stock || '-'}</td>
                      <td>${p.stock_quantity <= 0 ? '<span class="badge red">품절</span>' : p.has_expired ? '<span class="badge red">기한 경과</span>' : p.is_low ? '<span class="badge orange">부족</span>' : '<span class="badge green">정상</span>'}</td>
                    </tr>`
                  )
                  .join('')}</tbody>
              </table>`
            : '<div class="empty">상품이 없습니다.</div>';
          return data;
        } catch (error) {
          toast(error.message, 'error');
          return null;
        }
      }

      function setInventoryFilter(filter) {
        state.inventory.filter = filter;
        loadInventory();
      }

      async function selectInventoryProduct(id, { focusQty = false } = {}) {
        state.inventory.selectedId = id;
        loadInventory();
        try {
          const data = await api.request(`/pos/inventory/products/${id}/logs`);
          renderInventoryDetail(data.product, data.logs, data.lots || [], data.expiry_alert_days);
          if (focusQty) setTimeout(() => document.getElementById('adjQty')?.focus(), 30);
        } catch (error) {
          toast(error.message, 'error');
        }
      }

      function lotsSectionHtml(product, lots, alertDays, adjustAllowed) {
        const tracked = lots.reduce((sum, lot) => sum + lot.remaining_quantity, 0);
        const untracked = product.stock_quantity - tracked;
        return `
          <div class="section-title">유통기한 · 로트</div>
          ${lots.length
            ? `<table><thead><tr><th>로트</th><th>유통기한</th><th class="num">남은 수량</th>${adjustAllowed ? '<th></th>' : ''}</tr></thead><tbody>${lots
                .map(
                  (lot) => `<tr><td>${h(lot.lot_number || '-')}<div class="muted" style="font-size: 12px;">입고 ${fmtDateTime(lot.created_at).slice(0, 12)} · ${lot.received_quantity}개</div></td><td>${expiryBadge(lot.expiry_date, alertDays)}</td><td class="num" style="font-weight: 800;">${lot.remaining_quantity}</td>${adjustAllowed ? `<td><button class="btn btn-outline btn-sm" type="button" onclick="disposeLot(${product.id}, ${lot.id})">폐기</button></td>` : ''}</tr>`
                )
                .join('')}</tbody></table>`
            : '<div class="muted" style="font-size: 13px;">등록된 로트가 없습니다. 입고할 때 유통기한을 입력하면 임박·경과 알림을 받을 수 있습니다.</div>'}
          ${untracked > 0 && lots.length ? `<div class="muted" style="font-size: 12px; margin-top: 6px;">유통기한 미등록 재고 ${untracked}개 (판매 시 먼저 차감)</div>` : ''}
        `;
      }

      function disposeLot(productId, lotId) {
        state.inventory.adjustType = 'DISPOSE';
        state.inventory.disposeLotId = lotId;
        selectInventoryProduct(productId, { focusQty: true });
      }

      function renderInventoryDetail(product, logs, lots = [], alertDays = 90) {
        const box = document.getElementById('invDetail');
        if (!box) return;
        const adjustAllowed = can('can_adjust_stock');
        if (!adjustAllowed) state.inventory.adjustType = 'RECEIVE';
        const type = state.inventory.adjustType;
        const typeInfo = {
          RECEIVE: { qtyLabel: '입고 수량', reasons: ['정기 입고', '도매상 입고', '반품 재입고', '이동 입고'], button: '입고 처리' },
          DISPOSE: { qtyLabel: '폐기 수량', reasons: ['유통기한 경과', '파손', '변질', '분실'], button: '폐기 처리' },
          COUNT: { qtyLabel: '실제 센 수량', reasons: ['정기 실사', '전산 오류 정정', '분실 확인'], button: '실사 반영' }
        }[type];
        box.innerHTML = `
          <div class="section-title" style="margin-top: 0;">${h(product.product_name)}</div>
          <div class="muted" style="font-size: 13px; font-weight: 600; margin-bottom: 10px;">${product.barcode ? `바코드 ${h(product.barcode)}` : '바코드 없음'} · ${won(product.sale_price)}</div>
          <div style="display: flex; gap: 12px; margin-bottom: 14px;">
            <div class="metric" style="flex: 1;"><span>현재 재고</span><strong class="stock-big" style="${product.stock_quantity <= Math.max(product.safety_stock || 0, 0) ? 'color: var(--danger);' : ''}">${product.stock_quantity}</strong></div>
            <div class="metric" style="flex: 1;"><span>안전재고</span>
              ${adjustAllowed
                ? `<div style="display: flex; gap: 6px; margin-top: 6px;"><input id="safetyInput" class="input" type="number" min="0" value="${product.safety_stock || 0}" style="padding: 8px 10px;" /><button class="btn btn-outline btn-sm" type="button" onclick="saveSafetyStock(${product.id})">저장</button></div>`
                : `<strong>${product.safety_stock || 0}</strong>`}
            </div>
          </div>
          <div class="seg">
            <button type="button" class="${type === 'RECEIVE' ? 'active' : ''}" onclick="setAdjustType('RECEIVE', ${product.id})">입고</button>
            <button type="button" class="${type === 'DISPOSE' ? 'active' : ''}" onclick="setAdjustType('DISPOSE', ${product.id})" ${adjustAllowed ? '' : 'disabled title="관리자 전용"'}>폐기</button>
            <button type="button" class="${type === 'COUNT' ? 'active' : ''}" onclick="setAdjustType('COUNT', ${product.id})" ${adjustAllowed ? '' : 'disabled title="관리자 전용"'}>실사 조정</button>
          </div>
          <div class="pay-row-grid">
            <div class="field"><label class="label" for="adjQty">${typeInfo.qtyLabel}</label><input id="adjQty" class="input big" type="number" min="0" value="${type === 'COUNT' ? product.stock_quantity : ''}" oninput="previewAdjust(${product.stock_quantity})" onkeydown="if (event.key === 'Enter') submitAdjust(${product.id})" /></div>
            <div class="field"><label class="label">처리 후 재고</label><div class="input big" id="adjPreview" style="background: var(--bg-canvas);">${product.stock_quantity}</div></div>
          </div>
          ${type === 'RECEIVE'
            ? `<div class="pay-row-grid">
                <div class="field"><label class="label" for="adjExpiry">유통기한 (권장)</label><input id="adjExpiry" class="input" type="date" min="${h(state.ctx.today)}" /></div>
                <div class="field"><label class="label" for="adjLot">로트번호 (선택)</label><input id="adjLot" class="input" maxlength="40" placeholder="제조번호" /></div>
              </div>`
            : ''}
          ${type === 'DISPOSE' && lots.length
            ? `<div class="field"><label class="label" for="adjLotId">폐기할 로트</label><select id="adjLotId" class="input">
                <option value="">로트 지정 안 함 (미등록 재고부터)</option>
                ${lots.map((lot) => `<option value="${lot.id}" ${state.inventory.disposeLotId === lot.id ? 'selected' : ''}>${h(lot.lot_number || '로트번호 없음')} · ${h(lot.expiry_date)}${lot.days_left < 0 ? ' (경과)' : ''} · 남은 ${lot.remaining_quantity}개</option>`).join('')}
              </select></div>`
            : ''}
          <div class="field"><label class="label" for="adjReason">사유${type === 'RECEIVE' ? ' (선택)' : ' (필수)'}</label><input id="adjReason" class="input" value="${type === 'DISPOSE' && lots.find((lot) => lot.id === state.inventory.disposeLotId)?.days_left < 0 ? '유통기한 경과' : ''}" /></div>
          ${reasonChips('adjReason', typeInfo.reasons)}
          <button class="btn ${type === 'DISPOSE' ? 'btn-danger' : 'btn-primary'} btn-block btn-lg" type="button" onclick="submitAdjust(${product.id})">${typeInfo.button}</button>
          ${lotsSectionHtml(product, lots, alertDays, adjustAllowed)}
          <div class="section-title">재고 변동 이력</div>
          <div style="max-height: 26vh; overflow-y: auto;">
            ${logs.length
              ? logs
                  .map((l) => {
                    const diff = l.quantity_after - l.quantity_before;
                    return `<div class="kv" style="font-size: 13px;"><span>${fmtDateTime(l.created_at)} · <b>${STOCK_LOG_LABELS[l.change_type] || h(l.change_type)}</b> · ${h(l.reason || '')} <span class="muted">${h(l.created_by_name || '')}</span></span><span style="white-space: nowrap; ${diff < 0 ? 'color: var(--danger);' : diff > 0 ? 'color: var(--success);' : ''}">${diff > 0 ? '+' : ''}${diff} → ${l.quantity_after}</span></div>`;
                  })
                  .join('')
              : '<div class="muted">이력이 없습니다.</div>'}
          </div>
        `;
        previewAdjust(product.stock_quantity);
      }

      function setAdjustType(type, productId) {
        state.inventory.adjustType = type;
        state.inventory.disposeLotId = null;
        selectInventoryProduct(productId, { focusQty: true });
      }

      function previewAdjust(current) {
        const input = document.getElementById('adjQty');
        const preview = document.getElementById('adjPreview');
        if (!input || !preview) return;
        const qty = Number(input.value || 0);
        const type = state.inventory.adjustType;
        const next = type === 'RECEIVE' ? current + qty : type === 'DISPOSE' ? current - qty : qty;
        preview.textContent = `${next}${next !== current ? ` (${next - current > 0 ? '+' : ''}${next - current})` : ''}`;
        preview.style.color = next < 0 ? 'var(--danger)' : '';
      }

      function submitAdjust(productId) {
        withBusy(async () => {
          const quantity = document.getElementById('adjQty').value;
          if (quantity === '') throw new Error('수량을 입력해 주세요.');
          const data = await api.request('/pos/inventory/adjust', {
            method: 'POST',
            body: {
              product_id: productId,
              adjust_type: state.inventory.adjustType,
              quantity: Number(quantity),
              reason: document.getElementById('adjReason').value.trim(),
              expiry_date: document.getElementById('adjExpiry')?.value || undefined,
              lot_number: document.getElementById('adjLot')?.value.trim() || undefined,
              lot_id: Number(document.getElementById('adjLotId')?.value) || undefined
            }
          });
          state.inventory.disposeLotId = null;
          toast(`${data.product.product_name} 재고 ${data.product.stock_quantity}개로 반영`);
          setBadge('stockAlertCount', stockAlertTotal(data.alerts));
          loadProducts();
          await selectInventoryProduct(productId);
          document.getElementById('invQuery')?.focus();
        });
      }

      function saveSafetyStock(productId) {
        withBusy(async () => {
          const value = Number(document.getElementById('safetyInput').value);
          const data = await api.request(`/pos/inventory/products/${productId}/safety-stock`, { method: 'PATCH', body: { safety_stock: value } });
          toast(`안전재고 ${data.product.safety_stock}개로 설정`);
          setBadge('stockAlertCount', stockAlertTotal(data.alerts));
          await selectInventoryProduct(productId);
        });
      }

      /* ---------- 단말기 · VAN (데모) ---------- */

      async function openVanSettings() {
        try {
          const data = await api.request('/pos/van/terminal');
          const { terminal, van, van_companies: companies, transactions } = data;
          const owner = can('can_manage_van');
          const TX_LABELS = { APPROVE: '승인', CANCEL: '취소', CASH_RECEIPT: '현금영수증' };
          const STATUS_LABELS = { APPROVED: ['blue', '승인(미사용)'], USED: ['green', '판매 반영'], VOIDED: ['gray', '판매 전 취소'], DECLINED: ['red', '거절'] };
          openModal(
            `
            ${modalHead('단말기 · VAN 설정 <span class="demo-tag">데모</span>')}
            <div class="modal-body">
              <div class="notice" style="margin-bottom: 14px; background: #f3e8ff; color: #6d28d9; line-height: 1.6;">
                <b>(데모)</b> VAN사 계약·TID 발급 전이라 실제 단말기와 통신하지 않습니다. 자동 승인(데모)을 켜면 결제 화면에서 모의 승인번호가 발급되고, 취소·반품 시 모의 취소 승인번호가 남습니다.
                실제 계약 후에는 같은 화면에서 VAN사와 TID만 바꾸면 되도록 구조를 맞춰 두었습니다.
              </div>
              <div class="split">
                <div>
                  <div class="field"><label class="label" for="vanTerminalName">단말기 이름</label><input id="vanTerminalName" class="input" value="${h(terminal.terminal_name)}" ${owner ? '' : 'disabled'} /></div>
                  <label class="label">카드 승인 방식</label>
                  <div class="seg" id="vanModeSeg">
                    <button type="button" data-mode="MANUAL" class="${van.mode === 'MANUAL' ? 'active' : ''}" onclick="pickVanMode('MANUAL')" ${owner ? '' : 'disabled'}>수동 승인 (기존 단말기)</button>
                    <button type="button" data-mode="DEMO" class="${van.mode === 'DEMO' ? 'active' : ''}" onclick="pickVanMode('DEMO')" ${owner ? '' : 'disabled'}>자동 승인 (데모)</button>
                  </div>
                  <div class="pay-row-grid">
                    <div class="field"><label class="label" for="vanCompany">VAN사 (데모)</label>
                      <select id="vanCompany" class="input" ${owner ? '' : 'disabled'}><option value="">선택 안 함</option>${companies.map((c) => `<option ${terminal.van_company === c ? 'selected' : ''}>${h(c)}</option>`).join('')}</select></div>
                    <div class="field"><label class="label" for="vanTid">TID (데모)</label><input id="vanTid" class="input" value="${h(terminal.tid || '')}" placeholder="예: DEMO-0001" ${owner ? '' : 'disabled'} /></div>
                  </div>
                  ${owner ? '<button class="btn btn-primary btn-block" type="button" onclick="saveVanSettings()">저장</button>' : '<div class="notice">단말기 설정은 약국 관리자만 바꿀 수 있습니다.</div>'}
                  <div class="notice" style="margin-top: 12px;">데모 규칙: 5만원 미만 할부는 카드사 거절로 처리됩니다. 간편결제 바코드는 숫자 16~24자리(28로 시작=카카오페이, 29=네이버페이, 30=토스페이, 31=페이코)로 인식합니다.</div>
                </div>
                <div>
                  <div class="section-title" style="margin-top: 0;">오늘 VAN 기록 (데모)</div>
                  ${transactions.length
                    ? `<table><thead><tr><th>시간</th><th>구분</th><th class="num">금액</th><th>승인번호</th><th>상태</th></tr></thead><tbody>${transactions
                        .map((t) => {
                          const [color, label] = STATUS_LABELS[t.status] || ['gray', t.status];
                          return `<tr><td>${fmtTime(t.created_at)}</td><td>${TX_LABELS[t.transaction_type] || h(t.transaction_type)} · ${METHOD_LABELS[t.payment_method] || h(t.payment_method)}${t.card_company ? `<div class="muted" style="font-size: 12px;">${h(t.card_company)}</div>` : ''}</td><td class="num">${won(t.amount)}</td><td style="font-size: 13px;">${h(t.approval_number)}${t.order_number ? `<div class="muted" style="font-size: 12px;">${h(t.order_number)}</div>` : ''}</td><td><span class="badge ${color}">${label}</span></td></tr>`;
                        })
                        .join('')}</tbody></table>`
                    : '<div class="muted">기록이 없습니다.</div>'}
                </div>
              </div>
            </div>
          `,
            { size: 'wide' }
          );
          state.vanModeDraft = van.mode;
        } catch (error) {
          toast(error.message, 'error');
        }
      }

      function pickVanMode(mode) {
        state.vanModeDraft = mode;
        document.querySelectorAll('#vanModeSeg button').forEach((button) => button.classList.toggle('active', button.dataset.mode === mode));
      }

      function saveVanSettings() {
        withBusy(async () => {
          const data = await api.request('/pos/van/terminal', {
            method: 'PATCH',
            body: {
              terminal_name: document.getElementById('vanTerminalName').value.trim(),
              van_mode: state.vanModeDraft,
              van_company: document.getElementById('vanCompany').value,
              tid: document.getElementById('vanTid').value.trim()
            }
          });
          state.ctx.terminal = data.terminal;
          state.ctx.van = data.van;
          renderTopbar();
          toast(`${data.van.mode_label} 모드로 저장했습니다.`);
          openVanSettings();
        });
      }

      /* ---------- 현금 시재 ---------- */

      function sessionKv(summary, session) {
        return `
          <div class="kv"><span>시작 시재</span><span>${won(session.opening_cash)}</span></div>
          <div class="kv"><span>현금 결제 (순액)</span><span>${signedWon(summary.cash_net)}</span></div>
          <div class="kv"><span>현금 입금</span><span>+${won(summary.deposits)}</span></div>
          <div class="kv"><span>현금 출금</span><span>-${won(summary.withdrawals)}</span></div>
          <div class="kv strong"><span>예상 시재</span><span>${won(summary.expected_cash)}</span></div>
        `;
      }

      async function openCash() {
        if (!requireSession()) return;
        await refreshSession();
        const { summary } = state.session;
        openModal(`
          ${modalHead('현금 시재 · 입출금')}
          <div class="modal-body">
            ${sessionKv(summary, state.session)}
            ${can('can_cash_movement')
              ? `
              <div class="section-title">입출금 등록</div>
              <div class="tabs">
                <label class="chip"><input type="radio" name="moveType" value="DEPOSIT" checked /> 입금 (잔돈 보충 등)</label>
                <label class="chip"><input type="radio" name="moveType" value="WITHDRAW" /> 출금 (소모품·은행 입금 등)</label>
              </div>
              <div class="pay-row-grid">
                <div><label class="label">금액</label><input id="moveAmount" class="input" type="number" min="1" step="100" /></div>
                <div><label class="label">사유 (필수)</label><input id="moveReason" class="input" /></div>
              </div>
              <button class="btn btn-primary btn-block" style="margin-top: 12px;" type="button" onclick="saveMovement()">등록</button>
            `
              : '<div class="notice" style="margin-top: 12px;">현금 입출금은 약국 관리자 계정으로 등록할 수 있습니다.</div>'}
            ${summary.movements.length
              ? `<div class="section-title">오늘 입출금 내역</div>
                 ${summary.movements
                   .map(
                     (m) => `<div class="kv"><span>${fmtTime(m.created_at)} · ${m.movement_type === 'DEPOSIT' ? '입금' : '출금'} · ${h(m.reason)} <span class="muted">(${h(m.created_by_name || '')})</span></span><span>${m.movement_type === 'DEPOSIT' ? '+' : '-'}${won(m.amount)}</span></div>`
                   )
                   .join('')}`
              : ''}
          </div>
        `);
      }

      function saveMovement() {
        withBusy(async () => {
          const movement_type = document.querySelector('input[name="moveType"]:checked').value;
          const amount = Number(document.getElementById('moveAmount').value);
          const reason = document.getElementById('moveReason').value.trim();
          if (!amount || amount <= 0) throw new Error('금액을 입력해 주세요.');
          if (!reason) throw new Error('사유를 입력해 주세요.');
          await api.request(`/pos/sessions/${state.session.id}/cash-movements`, { method: 'POST', body: { movement_type, amount, reason } });
          toast(`${movement_type === 'DEPOSIT' ? '입금' : '출금'} ${won(amount)} 등록`);
          openCash();
        });
      }

      /* ---------- 일마감 ---------- */

      const DENOMS = [50000, 10000, 5000, 1000, 500, 100, 50, 10];

      async function openClose() {
        if (!requireSession()) return;
        await refreshSession();
        const { summary } = state.session;
        const owner = can('can_close');
        const holdCount = Number(document.getElementById('holdCount').textContent) || 0;
        openModal(
          `
          ${modalHead('일마감')}
          <div class="modal-body">
            ${holdCount ? `<div class="notice warn" style="margin-bottom: 14px;">보류 중인 판매가 ${holdCount}건 있습니다. 마감해도 보류는 남지만, 결제하지 않은 보류는 매출에 포함되지 않습니다. <button class="discount-link" type="button" onclick="openHolds()">보류 목록 보기</button></div>` : ''}
            <div class="metrics">
              <div class="metric"><span>판매</span><strong>${summary.sale_count}건 · ${won(summary.gross_sales)}</strong></div>
              <div class="metric"><span>반품 · 취소</span><strong style="color: var(--danger);">${summary.refund_count}건 · ${signedWon(summary.refund_total)}</strong></div>
              <div class="metric"><span>할인</span><strong>${won(summary.discount_total)}</strong></div>
              <div class="metric"><span>순매출</span><strong style="color: var(--toss-blue);">${signedWon(summary.net_sales)}</strong></div>
            </div>
            <div class="split">
              <div>
                <div class="section-title">결제수단별</div>
                ${summary.payments.length
                  ? summary.payments
                      .map(
                        (p) => `<div class="kv"><span>${METHOD_LABELS[p.payment_method] || h(p.payment_method)} <span class="muted">(${p.pay_count}건${p.refunded_amount ? ` · 환불 ${signedWon(p.refunded_amount)}` : ''})</span></span><span>${signedWon(p.net_amount)}</span></div>`
                      )
                      .join('')
                  : '<div class="muted">결제 내역이 없습니다.</div>'}
                <div class="section-title">현금 시재</div>
                ${sessionKv(summary, state.session)}
              </div>
              <div>
                ${owner
                  ? `
                  <div class="section-title">실제 현금 세기</div>
                  <div class="denoms">
                    ${DENOMS.map((d) => `<div class="denom"><label>${d.toLocaleString()}원</label><input class="input" type="number" min="0" data-denom="${d}" placeholder="0" oninput="sumDenoms()" /></div>`).join('')}
                  </div>
                  <div class="field" style="margin-top: 14px;">
                    <label class="label" for="actualCash">실제 현금 합계</label>
                    <input id="actualCash" class="input big" type="number" min="0" value="${summary.expected_cash}" oninput="renderDiff()" />
                  </div>
                  <div class="remain" id="closeDiff"></div>
                  <div class="field"><label class="label" for="closeNote">차액 사유 · 메모</label><input id="closeNote" class="input" placeholder="차액이 있으면 필수" /></div>
                  <button class="btn btn-primary btn-block btn-lg" type="button" onclick="confirmClose()">마감 확정</button>
                  <div class="notice" style="margin-top: 10px;">마감 후에는 이 영업에 판매를 추가할 수 없습니다. 다음 영업은 새 시재로 시작합니다.</div>
                `
                  : '<div class="notice warn">일마감은 약국 관리자 계정으로 확정할 수 있습니다.</div>'}
              </div>
            </div>
          </div>
        `,
          { size: 'wide' }
        );
        if (owner) renderDiff();
      }

      function sumDenoms() {
        const total = [...document.querySelectorAll('[data-denom]')].reduce((sum, input) => sum + Number(input.dataset.denom) * (Number(input.value) || 0), 0);
        document.getElementById('actualCash').value = total;
        renderDiff();
      }

      function renderDiff() {
        const expected = state.session.summary.expected_cash;
        const actual = Number(document.getElementById('actualCash').value || 0);
        const diff = actual - expected;
        const el = document.getElementById('closeDiff');
        el.className = `remain ${diff === 0 ? 'ok' : 'bad'}`;
        el.innerHTML = `<span>차액 (실제 - 예상)</span><span>${diff === 0 ? '0원 ✓' : signedWon(diff)}</span>`;
      }

      function confirmClose() {
        withBusy(async () => {
          const actual = Number(document.getElementById('actualCash').value);
          const note = document.getElementById('closeNote').value.trim();
          const diff = actual - state.session.summary.expected_cash;
          if (diff !== 0 && !note) throw new Error('차액 사유를 입력해 주세요.');
          if (!confirm(`실제 현금 ${won(actual)}으로 마감할까요?`)) return;
          const data = await api.request(`/pos/sessions/${state.session.id}/close`, { method: 'POST', body: { actual_cash: actual, note } });
          const closed = data.session;
          state.session = null;
          renderTopbar();
          openModal(
            `
            ${modalHead('마감 완료', { closable: false })}
            <div class="modal-body">
              <div class="metrics" style="grid-template-columns: repeat(2, 1fr);">
                <div class="metric"><span>순매출</span><strong>${signedWon(closed.summary.net_sales)}</strong></div>
                <div class="metric"><span>시재 차액</span><strong style="color: ${closed.cash_difference ? 'var(--danger)' : 'var(--success)'};">${signedWon(closed.cash_difference)}</strong></div>
              </div>
              <div class="kv"><span>예상 시재</span><span>${won(closed.expected_cash)}</span></div>
              <div class="kv"><span>실제 시재</span><span>${won(closed.actual_cash)}</span></div>
              ${closed.close_note ? `<div class="kv"><span>메모</span><span>${h(closed.close_note)}</span></div>` : ''}
              <div class="kv"><span>마감 시각</span><span>${fmtDateTime(closed.closed_at)}</span></div>
            </div>
            <div class="modal-foot">
              <button class="btn btn-outline" type="button" onclick="openReport()">매출 리포트</button>
              <button class="btn btn-primary" type="button" onclick="openSessionStart()">새 영업 시작</button>
            </div>
          `,
            { locked: true }
          );
        });
      }

      /* ---------- 리포트 · 감사 로그 ---------- */

      async function openReport(from = state.ctx.today, to = from, tab = 'sales') {
        const wasLocked = state.modalLocked && !state.session;
        try {
          const data = await api.request(`/pos/reports/daily?from=${from}&to=${to}`);
          let audit = null;
          if (tab === 'audit' && can('can_view_audit')) audit = (await api.request('/pos/audit-logs')).logs;
          const t = data.totals;
          const body =
            tab === 'audit'
              ? `
                <table>
                  <thead><tr><th>일시</th><th>구분</th><th>처리자</th><th>내용</th></tr></thead>
                  <tbody>${(audit || [])
                    .map(
                      (l) => `<tr><td style="white-space: nowrap;">${fmtDateTime(l.created_at)}</td><td><span class="badge ${['POS_CANCEL', 'POS_REFUND'].includes(l.action) ? 'red' : l.action === 'POS_DISCOUNT' ? 'orange' : 'gray'}">${AUDIT_LABELS[l.action] || h(l.action)}</span></td><td>${h(l.user_name || '-')}</td><td style="font-size: 13px;">${h(l.description)}</td></tr>`
                    )
                    .join('') || '<tr><td colspan="4" class="muted">기록이 없습니다.</td></tr>'}</tbody>
                </table>`
              : `
                <div class="metrics">
                  <div class="metric"><span>전체 순매출</span><strong>${signedWon(t.net_amount)}</strong></div>
                  <div class="metric"><span>매장 POS 순매출</span><strong style="color: var(--toss-blue);">${signedWon(t.pos_net_amount)}</strong></div>
                  <div class="metric"><span>POS 할인</span><strong>${won(t.discount_amount)}</strong></div>
                  <div class="metric"><span>POS 반품·취소</span><strong style="color: var(--danger);">${t.pos_refund_count}건 · ${signedWon(t.pos_refund_amount)}</strong></div>
                </div>
                <div class="split">
                  <div>
                    <div class="section-title">채널별 매출</div>
                    <table><thead><tr><th>채널</th><th class="num">건수</th><th class="num">반품</th><th class="num">순매출</th></tr></thead>
                    <tbody>${data.channels.map((c) => `<tr><td>${CHANNEL_LABELS[c.channel] || h(c.channel)}</td><td class="num">${c.order_count}</td><td class="num">${signedWon(c.refund_amount)}</td><td class="num" style="font-weight: 800;">${signedWon(c.net_amount)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">매출 없음</td></tr>'}</tbody></table>
                    <div class="section-title">결제수단별</div>
                    <table><thead><tr><th>수단</th><th class="num">결제</th><th class="num">환불</th><th class="num">순액</th></tr></thead>
                    <tbody>${data.payments.map((p) => `<tr><td>${METHOD_LABELS[p.payment_method] || h(p.payment_method)}</td><td class="num">${won(p.paid_amount)}</td><td class="num">${signedWon(p.refunded_amount)}</td><td class="num" style="font-weight: 800;">${signedWon(p.net_amount)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">결제 없음</td></tr>'}</tbody></table>
                    <div class="section-title">판매자별 (POS)</div>
                    <table><thead><tr><th>판매자</th><th class="num">판매</th><th class="num">반품</th><th class="num">순매출</th></tr></thead>
                    <tbody>${data.cashiers.map((c) => `<tr><td>${h(c.cashier_name)}</td><td class="num">${c.sale_count}</td><td class="num">${c.refund_count}</td><td class="num" style="font-weight: 800;">${signedWon(c.net_amount)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">판매 없음</td></tr>'}</tbody></table>
                  </div>
                  <div>
                    <div class="section-title">POS 상품 판매 순위</div>
                    <table><thead><tr><th>상품</th><th class="num">수량</th><th class="num">순매출</th></tr></thead>
                    <tbody>${data.products.map((p) => `<tr><td>${h(p.product_name)} ${p.product_type === 'OTC' ? '<span class="badge orange">일반의약품</span>' : ''}</td><td class="num">${p.net_quantity}</td><td class="num" style="font-weight: 800;">${signedWon(p.net_amount)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">판매 없음</td></tr>'}</tbody></table>
                    <div class="section-title">영업 · 마감 기록</div>
                    <table><thead><tr><th>영업일</th><th>상태</th><th class="num">예상</th><th class="num">실제</th><th class="num">차액</th></tr></thead>
                    <tbody>${data.sessions.map((s) => `<tr><td>${h(s.business_date)}<div class="muted" style="font-size: 12px;">${fmtTime(s.opened_at)}~${s.closed_at ? fmtTime(s.closed_at) : ''} · ${h(s.opened_by_name || '')}</div></td><td>${s.status === 'OPEN' ? '<span class="badge green">영업 중</span>' : '<span class="badge gray">마감</span>'}</td><td class="num">${s.expected_cash == null ? '-' : won(s.expected_cash)}</td><td class="num">${s.actual_cash == null ? '-' : won(s.actual_cash)}</td><td class="num" style="${s.cash_difference ? 'color: var(--danger); font-weight: 800;' : ''}">${s.cash_difference == null ? '-' : signedWon(s.cash_difference)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">기록 없음</td></tr>'}</tbody></table>
                  </div>
                </div>`;

          openModal(
            `
            ${modalHead('매출 리포트', { closable: !wasLocked })}
            <div class="modal-body">
              <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px;">
                <input id="reportFrom" class="input" style="width: 170px;" type="date" value="${h(from)}" />
                <span class="muted">~</span>
                <input id="reportTo" class="input" style="width: 170px;" type="date" value="${h(to)}" />
                <button class="btn btn-primary" type="button" onclick="openReport(document.getElementById('reportFrom').value, document.getElementById('reportTo').value, '${tab}')">조회</button>
                <div style="flex: 1;"></div>
                <button class="chip ${tab === 'sales' ? 'active' : ''}" type="button" onclick="openReport('${from}', '${to}', 'sales')">매출</button>
                ${can('can_view_audit') ? `<button class="chip ${tab === 'audit' ? 'active' : ''}" type="button" onclick="openReport('${from}', '${to}', 'audit')">감사 로그</button>` : ''}
              </div>
              ${body}
            </div>
            ${wasLocked ? '<div class="modal-foot"><button class="btn btn-primary" type="button" onclick="openSessionStart()">새 영업 시작</button></div>' : ''}
          `,
            { size: 'xwide', locked: wasLocked }
          );
        } catch (error) {
          toast(error.message, 'error');
        }
      }

      /* ---------- 키보드 ---------- */

      document.addEventListener('keydown', (event) => {
        if (document.body.classList.contains('guest')) return;
        if (event.key === 'Escape' && modalOpen()) return closeModal();
        if (event.key === 'F2') {
          event.preventDefault();
          if (!modalOpen()) document.getElementById('searchInput').select();
          return;
        }
        if (event.key === 'F4') {
          event.preventDefault();
          if (!modalOpen()) openCustomerSearch();
          return;
        }
        if (event.key === 'F9') {
          event.preventDefault();
          if (!modalOpen()) openPayment('sale');
          return;
        }
        if (event.key === 'F6') {
          event.preventDefault();
          if (!modalOpen()) openHoldCurrent();
          return;
        }
        if (event.key === 'F8') {
          event.preventDefault();
          if (!modalOpen()) openHolds();
          return;
        }
        const tag = event.target.tagName;
        const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag);
        if (!typing && !modalOpen() && event.key.length === 1 && !event.metaKey && !event.ctrlKey && !event.altKey) {
          document.getElementById('searchInput').focus();
        }
      });

      document.getElementById('modalBackdrop').addEventListener('mousedown', (event) => {
        if (event.target.id === 'modalBackdrop') closeModal();
      });

      renderNetwork();
      boot();
    </script>
  </body>
</html>
