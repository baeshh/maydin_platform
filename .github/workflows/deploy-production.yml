name: Deploy production

# 수동 실행만 한다(Actions 화면 또는 `gh workflow run deploy-production.yml -f ref=<sha>`).
# 테스트가 통과한 main 커밋만, SSH 없이 AWS SSM으로 서버의 server/scripts/deploy.sh를 실행한다.
# 필요한 설정(production 환경 변수): AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID, APP_URL — docs/deploy.md
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 배포할 커밋 SHA 또는 main
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    name: 배포할 커밋 확인
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: sha
        run: |
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::main에 들어간 커밋만 운영에 배포합니다 ($sha)"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  test:
    name: 테스트
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  deploy:
    name: 운영 배포 (SSM)
    needs: [resolve, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 서버에서 deploy.sh 실행
        run: |
          set -euo pipefail
          # 대상 커밋의 deploy.sh를 꺼내 ubuntu 사용자로 실행한다.
          script="cd /home/ubuntu/apps/maydin_platform && git fetch --quiet origin && git show ${SHA}:server/scripts/deploy.sh > /tmp/maydin-deploy.sh && bash /tmp/maydin-deploy.sh ${SHA}"
          params=$(jq -nc --arg c "sudo -iu ubuntu bash -lc '$script'" '{commands: [$c], executionTimeout: ["900"]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "maydin deploy ${SHA:0:7}" --parameters "$params" --query Command.CommandId --output text)
          echo "SSM command: $id"
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query StandardOutputContent --output text
          err=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query StandardErrorContent --output text)
          [ -z "$err" ] || [ "$err" = "None" ] || { echo "--- stderr"; echo "$err"; }
          echo "status: $status"
          [ "$status" = "Success" ] || { echo "::error::배포 실패 ($status) — 서버는 이전 버전으로 되돌렸습니다. 위 로그를 확인하세요."; exit 1; }

      - name: 운영 상태 확인
        run: |
          set -euo pipefail
          health=$(curl -fsS --retry 5 --retry-delay 3 "${{ vars.APP_URL }}/api/health")
          echo "$health"
          echo "$health" | jq -e '.ok == true and .db == "ok"' >/dev/null
          for path in / /pos.html /owner.html /store.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_URL }}$path")
            echo "$path $code"; [ "$code" = "200" ]
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_URL }}/api/auth/me")
          [ "$code" = "401" ] || { echo "::error::/api/auth/me 토큰 없이 $code"; exit 1; }

      - name: 요약
        if: always()
        run: |
          {
            echo "### 운영 배포: ${{ job.status }}"
            echo "- 커밋: \`${SHA}\`"
            echo "- 주소: ${{ vars.APP_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
