name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: 전체 테스트 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 운영 서버의 Node와 최신 24.x. better-sqlite3 13(N-API)부터 24.19+에서도 GC 중 비정상 종료가 없다(nodejs/node#65446).
        node: ['24.18.1', '24']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node tests/run.mjs
        env:
          SHOW_SERVER_LOG: '1'
